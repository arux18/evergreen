<!--
  ═══════════════════════════════ COMPONENT INTENT ═══════════════════════════════
  This file is a standalone HTML prototype of the Fiduciary get-to-know-you interview
  component: a step-by-step question flow (life stage, mindset, household, age, location,
  income, an illustrative tax-rate readout, savings rate, assets, home/rent-vs-buy, and
  objectives) that hands topical interest off to the host app's own AI-advisor chat.

  The PRODUCTION component consists of ONLY the interview itself (the header/eyebrow, the
  question stage, and the Next/Back/Skip nav). Everything else in this file exists solely to
  make the prototype testable in isolation and is NOT part of what ships:
    • The chat sidebar (#chatSidebar) simulates "the host app's real chat sidebar" so the
      hand-off behavior can be exercised here — see emitToChatSidebar()/mockAdvisorResponse().
      In production, the host app already has its own chat surface; the interview just calls
      into it directly with no local sidebar UI of its own.
    • The Control panel (#panel/#bottombar's "Control panel" button) is a build/debug tool for
      browsing flows, the question bank, and settings — it has no equivalent in production.
    • The light/dark and English/Español mode toggles (#modeToggles) let this
      prototype demonstrate supported look/language combinations. Production ships
      only ONE mode of each — light and English — until the app is ready to actually
      support the others; the toggles themselves are removed, not merely hidden, from the
      delivered component (the dark-mode and Spanish scaffolding follow the general approach
      of Component Template.html/Component Spec.md, adapted to this component's own content
      and styling, not their specific colors/copy).

  This file also bundles four additional flows — Short, Medium, Long, and Adaptive (see
  DATA/BANK/CUR and FLOWS below) — built from a separate, larger question bank than Fiduciary's
  own purpose-built questions. These are NOT current production scope, the same as the Control
  panel; they exist here purely for internal comparison and review. They may be used in the
  future as a starting point for developing one or more alternative production flows, but no such
  flow has been defined or committed.

  When handing this off for implementation, strip the three items above and the four
  non-Fiduciary flows, and ship only the Fiduciary interview + its hand-off call into the host
  app's real chat surface.

  GOVERNANCE: this prototype is canonical. On any disagreement with `interview PRD v1.1.md`
  or `interview-flow v1.1.md`, this file's actual interface and behavior win, and the
  documents are corrected to match — unless a human confirms the behavior here is a bug,
  in which case fix it here and record the decision in the PRD's Revision Log.
  ═════════════════════════════════════════════════════════════════════════════════
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evergreen — Interview Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&amp;family=Noto+Serif:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
  :root{
  /* Hemlock Design System (Component Template.html) — light tokens mapped onto the
     prototype's existing variable names so the rest of the stylesheet keeps working.
     --green = primary interactive blue (name kept from v1 for stability).
     --accent = selection/highlight color — the same Hemlock blue as --green. */
  --green:#3A6AF8; --green-2:#2952CC; --green-soft:#EBF0FE; --green-line:#C6D6FC;
  --bg:#FFFFFF; --card:#FFFFFF; --card-2:#F8F7F6;
  --ink:#0E0E0E; --muted:#5E5954; --faint:#6E6963;   /* Hemlock --faint #8A8680 is ~3.4:1 on white — darkened to keep the 16px note text AA */
  --line:#EEEDEB; --line-strong:#D5D3D0;
  --accent:#3A6AF8; --accent-hover:#2952CC; --accent-text:#3A6AF8;   /* ~4.6:1 on white — passes AA for text */
  --accent-fill:rgba(58,106,248,.15);   /* selected pill/scale fill (Hemlock --accent-fill) */
  --accent-soft:rgba(58,106,248,.08);   /* hover tints (suggest button, active flowcard, etc.) */
  --info-bg:rgba(58,106,248,.06); --info-border:rgba(58,106,248,.24);   /* notice boxes = Hemlock info tile */
  --danger:#C82320;
  --radius:12px; --shadow:0 4px 12px #0000001A;
  --margin:50px;                     /* page side margins: desktop */
  font-size:16px;
}
  @media (max-width:639px){ :root{--margin:30px} }   /* tablet + mobile */
  @media (max-width:389px){  :root{--margin:20px} }   /* mobile only */
  /* Dark theme — Hemlock dark tokens (Component Template.html). Most rules already read
   these via var(...); the previously hardcoded borders are converted to var(--line-strong)
   in a separate pass, so the old per-selector dark overrides are removed. */
html[data-theme="dark"]{
  --green:#5A86FF; --green-2:#8FB0FF; --green-soft:rgba(58,106,248,.18); --green-line:#33476E;
  --bg:#070A10; --card:#0E1524; --card-2:#121B2E;
  --ink:#EAF0FF; --muted:#9DB0D2; --faint:#8A9BBF;
  --line:#243350; --line-strong:#33476E; --danger:#F87171;
  --accent:#5A86FF; --accent-hover:#8FB0FF; --accent-text:#8FB0FF;   /* AA-safe text variant of the dark accent (~7.4:1 on --card) */
  --link-text:#8FB0FF;
  --accent-fill:rgba(90,134,255,.22);
  --accent-soft:rgba(90,134,255,.12);
  --info-bg:rgba(90,134,255,.12); --info-border:rgba(90,134,255,.32);
  --shadow:0 0 0 1px rgba(120,150,255,.06),0 16px 40px rgba(0,0,0,.60);
}
html[data-theme="dark"] .btn.link{color:var(--link-text)}
html[data-theme="dark"] .btn.ghost{color:var(--link-text); border-color:var(--link-text)}
html[data-theme="dark"] .chip, html[data-theme="dark"] .chip button{color:var(--link-text)}
html[data-theme="dark"] .flowchip{color:var(--link-text)}
  /* Page backdrop in dark mode: the same very-dark blue-black at the top, easing into a
     lighter, more saturated blue toward the bottom rather than staying flat. body is exactly
     one viewport tall (html,body{height:100%}) and doesn't itself scroll — main does — so
     this gradient is computed once against the full viewport and stays put regardless of
     main's scroll position; it never needs to repeat or track scrolling. Deliberately set
     directly on body rather than by changing --bg's value, since --bg is also used as a flat
     fill for small Control Panel surfaces (textareas, the condition editor) that shouldn't
     inherit a viewport-scaled gradient. */
html[data-theme="dark"] body{
  background:
    radial-gradient(150% 90% at 50% 100%,
      rgba(112,148,251,.22) 0%, rgba(88,115,192,.17) 18%, rgba(63,81,133,.13) 34%,
      rgba(51,64,103,.10) 48%, rgba(39,48,73,.07) 60%, rgba(26,31,44,.04) 70%,
      rgba(7,10,16,0) 82%),
    #070A10;
}
  /* Lorem-ipsum below-next copy and the projections page's slider labels sit at --faint/--muted
     brightness, calibrated for the light background — a little too dim against dark mode's own
     surfaces. Lightened here (chart axis/tick text has its own --proj-axis-label, set alongside
     --proj-invest/--proj-home above). Doesn't touch .below-next-note.placeholder-note, whose
     own higher-specificity dark-mode rule (above) already sets its (different, yellow-box) color. */
  html[data-theme="dark"] .below-next-note{ color:var(--muted); }
  html[data-theme="dark"] .proj-slider-item-label{ color:var(--muted); }
  html[data-theme="dark"] .badge{ background:#1c2436; color:#9db0d2; border-color:#2a3550; }
  html[data-theme="dark"] .badge.sens-Medium{ background:#2a2416; border-color:#4a3c1a; color:#e3b972; }
  html[data-theme="dark"] .badge.sens-High{ background:#2e1a1a; border-color:#4a2323; }
  html[data-theme="dark"] .chat-icon-btn.send,
  html[data-theme="dark"] .btn.primary:disabled{ background:#2a3550; color:#cbd5e8; }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Heebo",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-weight:400;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  button{font:inherit; cursor:pointer; border:none; background:none; color:inherit}
  input,textarea,select{font:inherit; color:inherit}

  /* ── layout ─────────────────────────────── */
  #app{
    height:100%; display:flex; flex-direction:column;
    transition:opacity .38s ease, transform .38s ease, margin-right .3s cubic-bezier(.3,.9,.3,1); transform-origin:center top;
  }
  body.sidebar-open #app{ margin-right:340px; }   /* shrinks main's available width to match the open chat sidebar, so the @container rules below see the same narrower width the sidebar visually leaves for interview content */
  /* Fade + shrink-toward-center rather than a slide/translate — a translate could carry
     content past the edges of whatever frame this prototype is embedded in, while a scale
     shrinks entirely inward and can never exceed its own starting box. Ends on display:none
     (set once the transition finishes; see closePage()) so nothing is left visible or in
     the layout, not just invisible-but-still-there. */
  #app.closing{opacity:0; transform:scale(.97); pointer-events:none}
  header{
    display:flex; align-items:center; gap:12px; padding:14px var(--margin) 10px;
  }
  #app>header{display:none}   /* top-of-page content removed per design review; delete this line to restore */
  .brand{font-family:"Noto Serif",Georgia,"Times New Roman",serif; font-size:19px; color:var(--ink); letter-spacing:.2px}
  .brand b{font-weight:700}
  .brand-sub{color:var(--faint); font-size:13px; font-family:-apple-system,sans-serif}
  .flowchip{
    font-size:12.5px; color:var(--green); background:var(--green-soft);
    border:1px solid var(--green-line); padding:4px 11px; border-radius:99px; white-space:nowrap;
  }
  .stepcount{margin-left:auto; font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums}
  #progressbar{display:none; height:4px; background:var(--line); margin:16px var(--margin) 0; border-radius:2px; overflow:hidden}
  #progressbar>div{height:100%; width:0%; background:var(--green); border-radius:2px; transition:width .35s ease}

  main{
    flex:1; min-height:0; overflow-y:auto; display:flex; justify-content:center; padding:120px var(--margin) 170px; position:relative;
    container-type:inline-size; container-name:interview;   /* lets the @container rules below react to main's own width, which is narrower than the real viewport once the chat sidebar is open (see body.sidebar-open above) */
  }
  /* Reel transition: the new stage scrolls down from above the fold to rest (handled by
     reelEnter), while the outgoing stage — cloned into a .stage-ghost by render() — keeps
     scrolling down and dissolving (reelExit). Both use the same linear speed; render()
     computes each element's own travel distance (its visible height — offsetHeight minus
     the invisible 600px scroll-headroom padding — plus the 120px gap) and sets
     --reel-from / --reel-to and animation-duration inline per instance. See render(). */
  /* 600px scroll headroom: guaranteed, in-content blank space below every page's last element
     (normally the below-Next note), so every page can be scrolled upward past the point where
     its top content leaves the viewport, with at least 600px of clear space visible beneath the
     note text. It lives on .stage itself — part of the scroller's CONTENT, which no browser can
     drop from scrollable overflow — rather than as padding on the scroll container, which is
     exactly the kind of block-end padding some engines have historically ignored. The script's
     SCROLL_HEADROOM constant subtracts this invisible padding back out of the reel-transition
     travel math so page transitions don't slow down. */
  .stage{width:100%; max-width:1024px; padding-bottom:600px}
  .stage.reel-enter{animation-name:reelEnter; animation-duration:500ms; animation-timing-function:linear; animation-fill-mode:both}
  .stage-ghost{
    position:absolute; top:120px; left:50%; transform:translateX(-50%); width:calc(100% - var(--margin)*2); max-width:1024px;
    pointer-events:none;
  }
  .stage-ghost.reel-exit{animation-name:reelExit; animation-duration:500ms; animation-timing-function:linear; animation-fill-mode:both}
  @keyframes reelEnter{from{transform:translateY(var(--reel-from,0px))} to{transform:translateY(0)}}
  /* .stage-ghost is horizontally centered via left:50%+translateX(-50%); since an animated
     "transform" replaces the whole property (not just the parts it names), the exit keyframe
     has to re-declare that translateX itself or the ghost loses its centering and jumps right
     by ~half its width for the length of the animation. */
  /* Fades out well before the translateY finishes, so the outgoing page visually vanishes
     quickly rather than lingering, semi-transparent, for the whole scroll distance. */
  @keyframes reelExit{
    from{opacity:1; transform:translateX(-50%) translateY(0)}
    22%{opacity:0}
    to{opacity:0; transform:translateX(-50%) translateY(var(--reel-to,0px))}
  }
  @media (max-width:639px){   /* tablet + mobile: eyebrow sits 40px from the top instead of 120px */
    main{padding-top:40px}
    .stage-ghost{top:40px}
  }
  /* container-query twin: same values, but triggered by main's own (possibly sidebar-shrunk)
     width instead of the real viewport — see body.sidebar-open and main's container-type above */
  @container interview (max-width:639px){
    main{--margin:30px; padding-top:40px}
    .stage-ghost{top:40px}
  }
  @container interview (max-width:389px){ main{--margin:20px} }   /* mobile-only equivalent; wins over the 639px block above at narrower widths */
  .phase{font-size:18px; text-transform:uppercase; letter-spacing:.14em; color:var(--accent-text); font-weight:700; margin-bottom:14px}
  @media (max-width:639px){ .phase{font-size:15px} }   /* tablet + mobile */
  @container interview (max-width:639px){ .phase{font-size:15px} }   /* container-query twin */
  h1.headline{
    font-family:"Noto Serif",Georgia,"Times New Roman",serif; font-weight:400;
    font-size:clamp(26px,4.4vw,38px); line-height:1.22; letter-spacing:-.01em; margin-bottom:28px;
  }
  /* 28px matches what the clamp() above already evaluates to right at this 639/640px
     boundary (640 * 4.4vw ≈ 28.16px) — holding here instead of jumping to a bigger fixed
     value keeps the size shrinking smoothly through the tablet range with no visible bump,
     until the mobile-only rule below takes it down further at the narrowest widths. */
  @media (max-width:639px){ h1.headline{font-size:28px} }   /* tablet + mobile */
  @container interview (max-width:639px){ h1.headline{font-size:28px} }   /* container-query twin */
  p.subhead{font-size:17px; line-height:1.5; color:var(--muted); margin-bottom:28px; max-width:56ch}
  .meta-badges{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
  .badge{font-size:11px; padding:3px 8px; border-radius:6px; background:#eee9dd; color:#6b6350; border:1px solid #e0d9c7}
  .badge.sens-Medium{background:#fdf1dc; border-color:#f0dcb2; color:#8a6414}
  .badge.sens-High{background:#fbe7e2; border-color:#efc4ba; color:var(--danger)}

  /* ── inputs ─────────────────────────────── */
  .answers{margin-bottom:8px}
  .stage .nav{margin-top:36px; padding-top:16px; border-top:1px solid var(--line-strong)}
  @media (min-width:640px){ .stage .nav{padding-top:32px} }   /* desktop only: more air above Next */
  @container interview (min-width:640px){ .stage .nav{padding-top:32px} }   /* container-query twin */
  @container interview (max-width:639px){ .stage .nav{padding-top:16px} }   /* undoes the boost above when the sidebar has narrowed main below 640px even though the real viewport hasn't */
  .navright{margin-left:auto; display:flex; align-items:center; gap:8px}
  .navsep{color:var(--ink); font-size:15px}
  .stage .nav .btn.skip{padding-right:0}  /* right edge of "Skip" = right end of the rule above */
  .pills{display:flex; flex-wrap:wrap; gap:10px}
  .pill{
    padding:12px 18px; border-radius:99px; background:var(--card); border:1.5px solid var(--line-strong);
    font-size:15.5px; transition:all .13s ease; color:var(--ink);
  }
  .pill:hover{border-color:var(--accent); transform:translateY(-1px)}
  .pill.sel{background:var(--accent-fill); border-color:var(--accent); color:var(--ink)}
  .pill.sel:hover{border-color:var(--accent)}
  .limit-note{font-size:12.5px; color:var(--faint); margin-top:10px}
  .scale-row{display:flex; gap:10px; align-items:stretch}
  .scale-btn{
    flex:1; max-width:86px; padding:16px 0; border-radius:12px; background:var(--card);
    border:1.5px solid var(--line-strong); font-size:18px; font-weight:600; transition:all .13s;
  }
  .scale-btn:hover{border-color:var(--accent)}
  .scale-btn.sel{background:var(--accent-fill); border-color:var(--accent); color:var(--ink)}
  .scale-btn.sel:hover{border-color:var(--accent)}
  /* Must come after the base .pill/.scale-btn rules above — a media-query
     override placed BEFORE the unconditional rule it's meant to override loses the cascade
     at equal specificity regardless of viewport, which is exactly what happened here the
     first time (the base rule, appearing later in source, was silently winning at every
     width). */
  @media (max-width:639px){   /* tablet + mobile: shorter answer buttons */
    .pill{padding:9px 16px}
    .scale-btn{padding:12px 0}
  }
  @container interview (max-width:639px){   /* container-query twin */
    .pill{padding:9px 16px}
    .scale-btn{padding:12px 0}
  }
  .scale-ends{display:flex; justify-content:space-between; margin-top:8px; font-size:12.5px; color:var(--faint); max-width:470px}
  .slider-wrap{max-width:470px}
  .slider-value{
    font-family:"Noto Serif",Georgia,serif; font-size:40px; color:var(--accent-text); margin-bottom:6px; display:flex; align-items:baseline; gap:10px;
  }
  .slider-value input[type=number]{
    width:110px; font-family:"Noto Serif",Georgia,serif; font-weight:400; font-size:30px; color:var(--accent-text);
    padding:2px 10px; border:1.5px solid var(--line); border-radius:10px; background:var(--card);
    text-align:right;
  }
  .num-suffix-wrap{
    display:inline-flex; align-items:center; justify-content:flex-end;
    border:1.5px solid var(--line); border-radius:10px; background:var(--card);
    padding:2px 10px;
  }
  .num-suffix-wrap input.has-suffix{
    width:70px; border:none; background:transparent; padding:0; border-radius:0;
  }
  .num-suffix{
    font-family:"Noto Serif",Georgia,serif; font-size:30px; color:var(--accent-text); pointer-events:none;
  }
  /* Every slider: thin light-grey track, orange fill (painted by paintRangeTrack based on
     value), plain orange thumb, no focus outline. -webkit-appearance:none is required —
     without it Chrome/Safari ignore track/thumb overrides entirely and keep native theme
     colors, which is why this used to show a dark outline and a black unfilled track. */
  input[type=range]{
    width:100%; -webkit-appearance:none; appearance:none;
    outline:none; background:var(--line); border-radius:4px; height:8px; cursor:pointer;
  }
  input[type=range]:focus{outline:none}
  input[type=range]::-webkit-slider-runnable-track{-webkit-appearance:none; background:transparent; height:8px; border-radius:4px}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:20px; height:20px; margin-top:-6px; border-radius:50%;
    background:var(--accent); border:none; cursor:pointer;
  }
  input[type=range]::-moz-range-track{background:var(--line); height:8px; border-radius:4px}
  input[type=range]::-moz-range-progress{background:var(--accent); height:8px; border-radius:4px}
  input[type=range]::-moz-range-thumb{
    width:20px; height:20px; border-radius:50%; background:var(--accent); border:none; cursor:pointer;
  }
  /* Projections-page sliders only: tracks ~25% thinner than the global 8px — 6px in light
     mode, 4px in dark mode (dark was already thinner, at 5px, per an earlier request; both
     reduced ~25% again per design request). Thumb stays 20px; its margin-top is recentered
     per track height: -(20-6)/2 = -7px light, -(20-4)/2 = -8px dark. */
  .proj-sliders input[type=range]{height:6px}
  .proj-sliders input[type=range]::-webkit-slider-runnable-track{height:6px}
  .proj-sliders input[type=range]::-webkit-slider-thumb{margin-top:-7px}
  .proj-sliders input[type=range]::-moz-range-track{height:6px}
  .proj-sliders input[type=range]::-moz-range-progress{height:6px}
  html[data-theme="dark"] .proj-sliders input[type=range]{height:4px}
  html[data-theme="dark"] .proj-sliders input[type=range]::-webkit-slider-runnable-track{height:4px}
  html[data-theme="dark"] .proj-sliders input[type=range]::-webkit-slider-thumb{margin-top:-8px}
  html[data-theme="dark"] .proj-sliders input[type=range]::-moz-range-track{height:4px}
  html[data-theme="dark"] .proj-sliders input[type=range]::-moz-range-progress{height:4px}
  .slider-minmax{display:flex; justify-content:space-between; font-size:12.5px; color:var(--faint)}
  /* margin-top here collapses with h1.headline's margin-bottom (also 28px) since nothing
     sits between them but the plain .answers wrapper — so it has to clearly exceed 28px to
     produce any visible extra gap above the first row. */
  .taxrate-table{max-width:300px; margin-top:40px; margin-left:24px}
  /* .trv is pushed flush right via margin-left:auto so the values line up as a column —
     that auto margin (not the gap below) is what actually sets the visible space between
     the two columns, so tightening it means narrowing the table's own max-width above. */
  .taxrate-row{display:flex; justify-content:flex-start; align-items:baseline; gap:20px; padding:6px 0}
  .taxrate-row .trl{font-family:"Noto Serif",Georgia,serif; font-weight:400; font-size:22px; width:170px; color:var(--ink)}
  .taxrate-row .trv{font-family:"Noto Serif",Georgia,serif; font-weight:400; font-size:22px; font-variant-numeric:tabular-nums; color:var(--ink); margin-left:auto; text-align:right; min-width:70px}
  .taxrate-row.total{margin-top:10px; padding-top:14px; border-top:1.5px solid var(--line-strong)}
  .taxrate-row.total .trl{font-weight:700; color:var(--ink)}
  .taxrate-row.total .trv{font-weight:700; color:var(--ink)}
  @media (max-width:639px){   /* tablet + mobile: smaller table type */
    .taxrate-row .trl, .taxrate-row .trv{font-size:18px}
  }
  @container interview (max-width:639px){ .taxrate-row .trl, .taxrate-row .trv{font-size:18px} }   /* container-query twin */
  textarea.free{
    width:100%; max-width:560px; min-height:110px; padding:14px 16px; border-radius:12px;
    border:1.5px solid var(--line); background:var(--card); resize:vertical; line-height:1.5; font-size:15.5px;
  }
  textarea.free:focus,input.textline:focus,.slider-value input[type=number]:focus{outline:none; border-color:var(--accent)}
  .chat-input-wrap{position:relative; width:100%}
  textarea.free.chat{
    width:100%; max-width:none; min-height:122px; max-height:260px; font-size:18px; line-height:1.5;
    padding:18px 142px 18px 20px; resize:none; overflow-y:auto; border-radius:14px;
  }
  .chat-icons{position:absolute; right:10px; bottom:14px; display:flex; align-items:center; gap:6px}
  .chat-icon-btn{
    width:38px; height:38px; flex:0 0 auto; padding:0; border-radius:50%; display:flex;
    align-items:center; justify-content:center; border:1.5px solid var(--line); background:var(--card); color:var(--muted);
  }
  .chat-icon-btn svg{width:18px; height:18px}
  .chat-icon-btn:hover{border-color:var(--green); color:var(--green)}
  .chat-icon-btn.send{border-color:transparent; background:#D5D3D0; color:#fff; cursor:not-allowed}

}

  /* ── long-term projections (simplified stand-in for the Lifetime Planning component) ── */
  /* Fixed data-color coding for the two asset segments — deliberately independent of the
     app accent (--accent), so a chart's asset-class legend doesn't repaint when accent
     tokens change. Retinted for dark mode so the bars don't jump out against the dark
     card background. Also defines
     --proj-axis-label, a dedicated (lighter-in-dark-mode) color for the chart's axis/tick text,
     independent of --faint/--muted so it can be tuned for chart legibility on its own. */
  :root{ --proj-invest:#0F766E; --proj-home:#CA8A04; --proj-axis-label:#8A8680; }   /* Hemlock categorical --cat-5 green (investments) + --cat-6 amber (home equity) — cat-1/2 avoided: blue is the page accent, teal read as more blue */
  html[data-theme="dark"]{ --proj-invest:#34D399; --proj-home:#E3B972; --proj-axis-label:#8A9BBF; }   /* dark analogues from the template: --pos green, --accent-4 amber */
  .proj-wrap{max-width:1024px}
  .proj-chart-frame{width:100%}
  .proj-chart-frame svg{width:100%; height:auto; display:block}
  /* The chart's viewBox scales every one of its contents (bars, gridlines, axis labels)
     proportionally to however wide .proj-chart-frame actually renders — so on wide desktop
     viewports, where .proj-wrap can grow all the way to 1024px, the axis/tick labels would
     grow right along with it, well past comfortable reading size. Capping the FRAME at
     700px (labels included, since they live inside the SVG) lets the chart use more desktop
     width than the earlier 579px tablet-width freeze while still stopping the labels from
     scaling up indefinitely; the in-SVG label font is also reduced (font-size 16, was 22)
     so the wider cap doesn't render oversized text. No margin:auto here: the frame stays
     left-aligned to match .proj-legend below it, which is already flush-left. */
  @media (min-width:640px){ .proj-chart-frame{max-width:700px} }
  @container interview (min-width:640px){ .proj-chart-frame{max-width:700px} }
  .proj-legend{display:flex; flex-wrap:wrap; gap:16px; margin-top:10px; font-size:12.5px; color:var(--muted)}
  .proj-legend span{display:inline-flex; align-items:center; gap:6px}
  .proj-legend i{width:12px; height:12px; border-radius:3px; display:inline-block; flex:none}
  .proj-legend i.line{width:14px; height:0; border-top:2px dashed var(--muted); border-radius:0}
  /* Six live "what-if" sliders (age, income, savings rate, assets, home equity, retirement
     age) feeding the chart above — laid out two-per-row on wider screens, one-per-row on
     narrow ones. Each slider reuses the same .slider-wrap/.slider-value/.slider-minmax
     look as the real interview sliders (slider()/moneyslider() elsewhere in this file). */
  .proj-sliders{display:grid; grid-template-columns:1fr 1fr; gap:8px 32px; margin-top:28px; align-items:start; max-width:700px}   /* max-width matches .proj-chart-frame's cap so the slider columns never run wider than the chart above */
  .proj-slider-item{margin-top:18px}
  /* Label and value share one row (value flush right, directly above the track) instead of
     the value getting its own line — cuts a full line of height off each of the six
     sliders. margin-bottom is intentionally tight so the track sits close beneath. */
  .proj-slider-item-label{display:flex; align-items:center; justify-content:space-between; gap:12px; font-size:14px; color:var(--muted); margin-bottom:4px}
  @media (max-width:639px){ .proj-sliders{grid-template-columns:1fr} }
  /* Halved "orange number" display (per request, to save vertical space) — and a fixed,
     shared height for that value row so a plain slider's bordered number box and a money
     slider's bare, larger dollar text always occupy the same vertical space. Without this,
     the two control types resolve to slightly different heights and the range tracks below
     them (and the titles above, once rows differ in height) drift out of line with each
     other across the two-column grid. */
  .proj-sliders .slider-value{font-size:20px; height:32px; align-items:center; margin-bottom:0}
  .proj-sliders .slider-value input[type=number]{font-size:15px; width:60px; padding:2px 8px}
  /* .has-suffix (the Savings rate box) needs its own, more specific override: the general
     rule just above was accidentally winning the padding tie-break too (same specificity,
     later in source order), leaving only ~16px of content width inside a 32px box — enough
     to hide the number entirely behind the "%" sign. Adding .has-suffix here outranks it. */
  .proj-sliders .slider-value input[type=number].has-suffix{width:32px; padding:0}
  .proj-sliders .num-suffix-wrap{padding:2px 8px}
  .proj-sliders .num-suffix{font-size:15px}

  /* flex-wrap so that when the row runs out of horizontal space, whichever button doesn't
     fit drops to a new line as a whole button — paired with .btn's white-space:nowrap and
     flex-shrink:0 below, which stop a button from ever compressing/wrapping its OWN label
     onto two lines instead. In the common case (primary Next/Register button + one second
     button like Advisor/suggest/skip) this means the second button is what drops below the

  .nav{display:flex; align-items:center; gap:12px; margin-top:6px; flex-wrap:wrap}

  .btn.advisor{

  /* ── simulated chat sidebar ─────────────── */

    background:var(--card); border-left:1px solid var(--line); box-shadow:-14px 0 40px rgba(24,39,32,.14);

  .chat-sidebar-message{
    background:var(--green-soft); border:1px solid var(--green-line); border-radius:12px;
    padding:12px 14px; font-size:14.5px; line-height:1.45; min-height:1.45em;
  }
  .csm-question{font-weight:600; margin-bottom:12px}
  .csm-summary-label{font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; color:var(--muted); margin-bottom:6px}
  .csm-row{display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:13px; border-top:1px solid rgba(58,106,248,.12)}
  .csm-row:first-of-type{border-top:none}
  .csm-row-label{color:var(--muted)}
  .csm-row-value{text-align:right; font-weight:600; color:var(--ink)}
  .csm-row-value.csm-row-muted{font-weight:400; font-style:italic; color:var(--faint)}
  .chat-sidebar-response-wrap{flex:0 0 auto; padding:14px 18px 18px; border-top:1px solid var(--line)}
  .chat-sidebar-response{
    background:var(--card-2); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; font-size:14px; line-height:1.5; color:var(--muted);
  }
  .toast{
    position:fixed; bottom:86px; left:50%; transform:translateX(-50%) translateY(20px); z-index:60;
    background:var(--ink); color:#fff; font-size:13.5px; padding:10px 20px; border-radius:99px; opacity:0; transition:all .25s; pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%)}
  /* Persistent (non-fading) nudge shown on every page once a response has been emitted into
     the chat sidebar — see updateChatNudge(). Sits just above #bottombar so it never overlaps
     the interview content itself, whatever page is showing. */
  .chat-nudge{
    position:fixed; left:50%; bottom:78px; transform:translateX(-50%) translateY(6px); z-index:21;
    background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:10px 18px; font-size:13px; line-height:1.4; color:var(--muted); text-align:center;
    max-width:min(460px, calc(100% - 48px)); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .chat-nudge.show{opacity:1; transform:translateX(-50%) translateY(0)}
  @media (max-width:389px){ .chat-nudge{ bottom:64px; font-size:12px; padding:8px 14px } }
  .preview-banner{
    background:#fdf1dc; border:1px solid #f0dcb2; color:#8a6414; font-size:13px; border-radius:10px;
    padding:9px 14px; margin-bottom:20px; display:flex; align-items:center; gap:10px;
  }
  .preview-banner button{margin-left:auto; font-weight:700; text-decoration:underline}
  .empty-note{color:var(--faint); font-size:13.5px; padding:14px 4px}
  @media (max-width:389px){   /* mobile only */
    .scale-btn{max-width:none}
    header{padding:12px var(--margin) 8px; gap:8px}
    main{padding:40px var(--margin) 170px}
    .flowchip{max-width:36vw; overflow:hidden; text-overflow:ellipsis}
    .brand span{display:none}                /* hide "· Interview prototype" tag on phones */
    h1.headline{font-size:27px}
    .btn{padding:12px 22px}
    .panel-head{flex-wrap:wrap; row-gap:4px}
    .panel-body{overflow-x:auto}             /* bank table scrolls sideways instead of crushing */
    .slider-value{font-size:34px}
    .phase{font-size:13px}
  }
  @container interview (max-width:389px){   /* container-query twin — content-area rules only; header/flowchip/brand/panel are chrome and excluded */
    .scale-btn{max-width:none}
    main{padding:40px var(--margin) 170px}
    h1.headline{font-size:27px}
    .btn{padding:12px 22px}
    .slider-value{font-size:34px}
    .phase{font-size:13px}
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>evergreen</b>.ai <span class="brand-sub">· Interview prototype</span></div>
    <div class="flowchip" id="flowChip"></div>
    <div class="stepcount" id="stepCount"></div>
  </header>
  <div id="progressbar"><div></div></div>
  <main><div class="stage" id="stage"></div></main>
</div>

<button id="closeX" title="Close" data-i18n-title="closeX_title" onclick="closePage()"><svg viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"></svg></button>

<!-- Mode toggles (light/dark, English/Español) + the control panel button:
     both are testing-only prototype chrome, not part of the production component — see the
     component-intent comment near the top of this file. -->
<div id="bottombar">
  <button id="panelToggle" onclick="Panel.toggle()">
    <svg width="15" height="15" viewbox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></svg>
    <span data-i18n="panel_toggle">Control panel</span>
  </button>
  <div id="modeToggles">
    <div class="mode-seg" id="themeToggle" role="group" aria-label="Theme">
      <button type="button" data-set-theme="light" class="on" data-i18n="th_light">Light</button>
      <button type="button" data-set-theme="dark" data-i18n="th_dark">Dark</button>
    </div>
    <div class="mode-seg" id="langToggle" role="group" aria-label="Language">
      <button type="button" data-set-lang="en" class="on">English</button>
      <button type="button" data-set-lang="es">Español</button>
    </div>
  </div>
</div>

<div id="backdrop" onclick="Panel.close()"></div>
<div id="panel">
  <div class="panel-grip"></div>
  <div class="panel-head" id="panelTabs"></div>
  <div class="panel-body" id="panelBody"></div>
</div>
<div class="toast" id="toast"></div>
<div class="chat-nudge" id="chatNudge" aria-hidden="true"><span data-i18n="chat_nudge">Talk to your AI Advisor in the message box in the lower right-hand corner of the screen.</span></div>

<!-- Simulated "chat sidebar of the app" — this prototype is a standalone component with no
     real host app to hand questions off to, so this drawer stands in for that integration
     point: emitToChatSidebar() (see script) populates the message box below and shows the
     canned response that a real AI advisor chat would produce. -->
<div id="chatSidebar" aria-hidden="true">
  <div class="chat-sidebar-head">
    <span><span data-i18n="chat_head">AI Advisor</span> <span class="chat-sidebar-tag" data-i18n="chat_tag">simulated host chat sidebar</span></span>
    <button id="chatSidebarClose" type="button" title="Close" data-i18n-title="chat_close" onclick="closeChatSidebar()">×</button>
  </div>
  <div class="chat-sidebar-body">
    <div class="chat-sidebar-scroll" id="chatSidebarScroll">
      <div class="chat-sidebar-label" data-i18n="chat_message_label">Message</div>
      <div class="chat-sidebar-message" id="chatSidebarMessage"></div>
    </div>
    <div class="chat-sidebar-response-wrap">
      <div class="chat-sidebar-label" data-i18n="chat_response_label">Response</div>
      <div class="chat-sidebar-response" id="chatSidebarResponse"></div>
    </div>
  </div>
</div>

/* ═══════════════ PURE LOGIC (testable) ═══════════════ */
function flat(v){
  if (v == null) return null;
  if (Array.isArray(v)) return v;
  if (typeof v === "object"){ const a = (v.sel||[]).slice(); if (v.text && String(v.text).trim()) a.push(String(v.text).trim()); return a; }
  return v;
}
function hasAnswer(a){
  if (!a || a.skipped) return false;
  const f = flat(a.v);
  if (f == null || f === "") return false;
  if (Array.isArray(f) && !f.length) return false;
  return true;
}
function includesVal(f, val){
  if (Array.isArray(f)) return f.map(String).includes(String(val));
  return String(f) === String(val);
}
function condOne(c, A){
  const a = A[c.qid];
  if (c.op === "answered") return hasAnswer(a);
  // "isNot" reads as "the answer is definitely not X" — with no answer at all that's
  // trivially true, so it must be checked before the generic unanswered-guard below
  // (which otherwise treats every op, "isNot" included, as false until answered).
  if (c.op === "isNot") return !hasAnswer(a) || !condOne({...c, op:"is"}, A);
  if (!hasAnswer(a)) return false;
  const f = flat(a.v);
  switch(c.op){
    case "is":          return Array.isArray(f) ? (f.length===1 && String(f[0])===String(c.value)) : String(f)===String(c.value);
    case "isNot":       return !condOne({...c, op:"is"}, A);
    case "includes":    return includesVal(f, c.value);
    case "notIncludes": return !includesVal(f, c.value);
    case "includesAny": return (c.value||[]).some(v => includesVal(f, v));
    case "in":          return (c.value||[]).map(String).includes(Array.isArray(f) ? String(f[0]) : String(f));
    case "gte":         return Number(f) >= Number(c.value);
    case "lte":         return Number(f) <= Number(c.value);
    case "countGt":     return Array.isArray(f) && f.length > Number(c.value);
    default: return true;
  }
}
function condOk(showIf, A){
  if (!showIf) return true;
  const conds = Array.isArray(showIf) ? showIf : [showIf];
  return conds.every(c => c.any ? c.any.some(x => condOne(x, A)) : condOne(c, A));
}
function visibleSteps(flow, A){
  const out = [];
  flow.steps.forEach((s, i) => { if (condOk(s.showIf, A)) out.push(i); });
  return out;
}
function parseMax(txt){
  const m = /up to (\d+)/i.exec(txt || "");
  return m ? parseInt(m[1],10) : null;
}
function parseRangeSpec(txt){
  const m = /(\d+)\s*[–—-]\s*(\d+)/.exec(txt || "");
  if (!m) return null;
  const d = /default\s*(\d+)/i.exec(txt || "");
  return { min:+m[1], max:+m[2], def: d ? +d[1] : Math.round((+m[1] + +m[2])/2) };
}
function rendererFor(input, opts){
  const t = (input || "").toLowerCase();
  if (t.includes("zip"))    return "zip";
  if (t.includes("chat"))   return "chat";
  if (t.includes("projections")) return "projections";
  if (t.includes("register")) return "register";
  if (t.includes("info"))   return "info";
  if (t.includes("money"))  return "moneyslider";
  if (t.includes("scale"))  return "scale";
  if (t.includes("slider")) return "slider";
  if (t.includes("chips"))  return "chips";
  if (t.includes("search")) return "search";
  if (t.includes("free"))   return "text";
  if (t.includes("multi"))  return opts ? "multi" : "text";
  if (t.includes("bubbles") && t.includes("text")) return opts ? "combo" : "text";
  if (t.includes("bubbles") || t.includes("range")) return opts ? "single" : "text";
  return opts ? "single" : "text";
}

function describeCond(showIf){
  if (!showIf) return null;
  const conds = Array.isArray(showIf) ? showIf : [showIf];
  const one = c => {
    if (c.any) return c.any.map(one).join(" OR ");
    const qt = c.qid;
    const val = Array.isArray(c.value) ? c.value.join("/") : c.value;
    const opTxt = {is:"=", isNot:"≠", includes:"has", notIncludes:"lacks", includesAny:"has any of", in:"∈", answered:"answered", gte:"≥", lte:"≤", countGt:"selected >"}[c.op] || c.op;
    return c.op === "answered" ? `${qt} ${opTxt}` : `${qt} ${opTxt} ${val}`;
  };
  return "if " + conds.map(one).join(" & ");
}

// Given a sorted [floor, rate] bracket list and an income, returns the marginal rate
// (the rate on the next dollar) — the rate of the last bracket whose floor is <= income.
function marginalRate(brackets, income){
  if (!brackets || !brackets.length) return 0;
  return brackets.reduce((r, [floor, rate]) => income >= floor ? rate : r, brackets[0][1]);
}

// Resolves a ZIP code to { stateAbbr, stateName, localArea } using the embedded tax data.
// localArea is the TAX_LOCALS key (e.g. "New York City, NY") or null if the ZIP isn't in
// any of the spreadsheet's 20 taxed local jurisdictions.
function resolveTaxJurisdiction(zip){
  const localArea = TAX_ZIP_TO_LOCAL[zip] || null;
  let stateAbbr = null;
  if (localArea){
    const m = localArea.match(/,\s*([A-Z]{2})$/);
    if (m) stateAbbr = m[1];
  }
  if (!stateAbbr && zip && zip.length >= 3){
    stateAbbr = TAX_ZIP3_TO_STATE[zip.slice(0,3)] || null;
  }
  const stateName = stateAbbr ? (TAX_STATE_NAME[stateAbbr] || null) : null;
  return { stateAbbr, stateName, localArea };
}

// Computes real state + local marginal ordinary-income tax rates (as decimal fractions,
// e.g. 0.05 = 5%) for the given ZIP, filing status ("mfj" or "single"), and income.
// Returns { stateLabel, statePct, localLabel, localPct } — stateLabel/localLabel are the
// row labels to display (full state name; city/location name, or "Local" if not applicable).
function computeTaxRates(zip, filingKey, income){
  const { stateName, localArea } = resolveTaxJurisdiction(zip);
  let statePct = 0, stateLabel = "State";
  if (stateName){
    stateLabel = stateName;
    const sd = TAX_STATES[stateName];
    if (sd && !sd.none){
      statePct = marginalRate(sd[filingKey] || sd.single, income);
    }
  }
  let localPct = 0, localLabel = "Local";
  if (localArea){
    const ld = TAX_LOCALS[localArea];
    if (ld && ld.appliesInv){
      if (ld.special === "yonkers"){
        // Yonkers' resident tax is a 16.75% surcharge on NY State tax liability — the
        // marginal-rate analog is 16.75% of the NY State marginal rate at this income.
        const nyRate = marginalRate(TAX_STATES["New York"][filingKey] || TAX_STATES["New York"].single, income);
        localPct = 0.1675 * nyRate;
      } else {
        localPct = marginalRate(ld[filingKey] || ld.single, income);
      }
      if (localPct > 0) localLabel = TAX_LOCAL_LABEL[localArea] || "Local";
    }
  }
  return { stateLabel, statePct, localLabel, localPct };
}

// Paints the orange-filled / light-grey-unfilled two-tone look on a range input.
// Chrome/Safari only show accent-color on the thumb once -webkit-appearance:none is
// set (see the input[type=range] CSS), so the "filled" portion has to be drawn by hand
// as a gradient sized to the current value's percentage across the track.
function paintRangeTrack(rangeEl, pct){
  const p = Math.max(0, Math.min(100, pct));

}
// The fixed #bottombar overlaps the bottom of main's scrollable area — main's own
// padding-bottom exists purely to keep scrolled content clear of it. #bottombar's height
// isn't fixed, though: its mode-toggle segmented controls wrap onto extra lines at
// narrower widths, and translated strings run longer or shorter — so a single guessed
// padding value drifts out of sync and can leave the tail of a tall step (like the
// projections page's note text) partly hidden behind it. This measures the real height
// and pads main to clear it, with a little headroom on top. (The 600px scroll headroom
// below every page lives on .stage's own padding-bottom instead — see the .stage CSS
// comment and SCROLL_HEADROOM — so it can never be dropped from scrollable overflow.)
function syncMainBottomPadding(){
