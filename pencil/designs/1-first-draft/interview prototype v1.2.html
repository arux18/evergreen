// flat, illustrative assumptions (a blended equity/bond return and a home-appreciation
// rate, both borrowed from the reference component's own default capital-market
// assumptions). This is not a real financial plan or simulation.
function computeProjectionRows(values){
  const { age0, income0, srate, assets0, homeEq0, retireAge, retSpendFixed } = values;
  const TERMINAL_AGE = 90;
  const INV_RETURN = 0.06, HOME_APPR = 0.04, INFLATION = 0.025, INCOME_GROWTH = 0.025;

  let invest = assets0, home = homeEq0, income = income0, retSpend = null;
  const rows = [];
  const startAge = Math.round(age0);
  for (let age = startAge; age <= TERMINAL_AGE; age++){
    rows.push({ age, invest, home, total: invest + home });
    if (age < retireAge){
      invest = invest * (1 + INV_RETURN) + income * (srate / 100);
      income = income * (1 + INCOME_GROWTH);
    } else {
      // Post-retirement spending is a fixed dollar figure (70% of the income the person
      // had defaulted in when this step first mounted — see retSpendFixed in the
      // projections() renderer), not a percentage of `income` above. That `income`
      // variable keeps compounding purely to size pre-retirement contributions; dragging
      // the income slider afterward changes contributions but deliberately never touches
      // retirement spending, which used to scale with (and inflate) live income changes.
      if (retSpend === null) retSpend = retSpendFixed;
      invest = invest * (1 + INV_RETURN) - retSpend;
      retSpend = retSpend * (1 + INFLATION);
    }
    home = home * (1 + HOME_APPR);
  }
  return { rows, age0: startAge, terminalAge: TERMINAL_AGE };
}
// Builds the annual stacked-bar chart as an SVG markup string. Each year's bar spans from
// the zero line to that year's projected total (this simplified model's stand-in for the
// reference component's "50%" median line — there's no Monte Carlo fan to draw here, just
// one deterministic path). Positive-total bars stack investment assets (light blue) below
// home equity (light orange); a negative-total bar is drawn solid in the investment color,
// since in this simplified model only the liquid/investment side can go negative.
function buildProjectionSVG(proj, retireAge){
  const { rows, age0, terminalAge } = proj;
  // Padding is generous on all sides to leave room for the axis labels/Retire label
  // (font-size:16 — reduced from 22 when .proj-chart-frame's cap widened to 700px).
  const W = 680, H = 320, padL = 90, padR = 10, padT = 36, padB = 42;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const totals = rows.map(r => r.total);
  const minVal = Math.min(0, ...totals), maxVal = Math.max(0, ...totals);
  const span = (maxVal - minVal) || 1;
  const pad = span * 0.08;
  const domainMin = minVal < 0 ? minVal - pad : 0;
  const domainMax = maxVal + pad;
  const domain = (domainMax - domainMin) || 1;
  const yFor = v => padT + plotH - ((v - domainMin) / domain) * plotH;
  const zeroY = yFor(0);

  const n = rows.length;
  const slot = plotW / n;
  const barW = Math.max(1, slot - 1.5);
  const xFor = i => padL + i * slot;

  const fmtK = v => (v < 0 ? "-$" : "$") + Math.round(Math.abs(v) / 1000).toLocaleString("en-US") + "k";

  // "Nice" round-number step (1/2/5/10/20/50... × 10^n) for the horizontal gridlines, so the
  // handful of lines marking "even" dollar amounts up the chart land on tidy values instead
  // of the raw min/max.
  const niceStep = (range, targetSteps) => {
    const rough = range / targetSteps;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    const stepMult = norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10;
    return stepMult * mag;
  };
  const gridStep = niceStep(domainMax - domainMin, 5) || 1;
  let gridLines = "";
  const firstGrid = Math.ceil(domainMin / gridStep) * gridStep;
  for (let v = firstGrid; v <= domainMax + 1e-6; v += gridStep){
    if (Math.abs(v) < gridStep / 1000) continue;   // 0 is drawn separately, below, as the more prominent zero-line
    const y = yFor(v);
    gridLines += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${(W - padR).toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)" stroke-width="1"/>`;
    gridLines += `<text x="${(padL - 10).toFixed(1)}" y="${(y + 7).toFixed(1)}" font-size="16" style="fill:var(--proj-axis-label)" text-anchor="end">${fmtK(v)}</text>`;
  }

  // Y-axis line at the chart's left edge — i.e. at the current (starting) age.
  const yAxisLine = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" style="stroke:var(--line)" stroke-width="1"/>`;

  let bars = "";
  rows.forEach((r, i) => {
    const x = xFor(i);
    if (r.total >= 0){
      const blueTo = Math.max(0, Math.min(r.invest, r.total));
      if (blueTo > 0){
        const y = yFor(blueTo);
        bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${(zeroY - y).toFixed(1)}" style="fill:var(--proj-invest)"/>`;
      }
      if (r.total > blueTo){
        const yTop = yFor(r.total), yBot = yFor(blueTo);
        bars += `<rect x="${x.toFixed(1)}" y="${yTop.toFixed(1)}" width="${barW.toFixed(1)}" height="${(yBot - yTop).toFixed(1)}" style="fill:var(--proj-home)"/>`;
      }
    } else {
      const y = zeroY, h = yFor(r.total) - zeroY;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" style="fill:var(--proj-invest)"/>`;
    }
  });

  let ticks = "";
  rows.forEach((r, i) => {
    if ((r.age - age0) % 10 === 0){
      const x = xFor(i) + barW / 2;
      ticks += `<text x="${x.toFixed(1)}" y="${H - 10}" font-size="16" style="fill:var(--proj-axis-label)" text-anchor="middle">${r.age}</text>`;
    }
  });

  const retireIdx = Math.max(0, Math.min(n - 1, retireAge - age0));
  const retireX = xFor(retireIdx);
  const retireLine =
    `<line x1="${retireX.toFixed(1)}" y1="${padT}" x2="${retireX.toFixed(1)}" y2="${padT + plotH}" style="stroke:var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>` +
    `<text x="${retireX.toFixed(1)}" y="${padT - 12}" font-size="16" style="fill:var(--proj-axis-label)" text-anchor="middle">${t("proj_retire_label")}</text>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
    ${gridLines}
    ${yAxisLine}
    <line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W - padR}" y2="${zeroY.toFixed(1)}" style="stroke:var(--line)" stroke-width="1.5"/>
    <text x="${(padL - 10).toFixed(1)}" y="${(zeroY + 7).toFixed(1)}" font-size="16" style="fill:var(--proj-axis-label)" text-anchor="end">$0</text>
    ${bars}
    ${retireLine}
    ${ticks}
  </svg>`;
}
function toast(msg){
  const n = document.getElementById("toast");   // named n, not t — keeps the global t() translation helper visible
  n.textContent = msg; n.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => n.classList.remove("show"), 1900);
}
/* ── simulated chat sidebar ───────────────────────────────────────────────
   This component has no real host app to hand a question off to, so this drawer stands in
   for "the chat sidebar of the app": emitToChatSidebar() is the single integration point —
   in a real deployment this would call out to the host app's actual chat sidebar instead of
   painting a local panel. mockAdvisorResponse() is a placeholder for whatever the host app's
   AI/advisor backend would actually return. */
function openChatSidebar(){
  const el = document.getElementById("chatSidebar");
  if (el){ el.classList.add("open"); el.setAttribute("aria-hidden", "false"); }
  // Narrows #app by the sidebar's own width (see body.sidebar-open in CSS), which in turn
  // narrows main — the interview's @container "interview" queries pick up on that shrink
  // and apply the same tablet/mobile formatting the real viewport would show at that width.
  document.body.classList.add("sidebar-open");
  updateChatNudge();
}
function closeChatSidebar(){
  const el = document.getElementById("chatSidebar");
  if (el){ el.classList.remove("open"); el.setAttribute("aria-hidden", "true"); }
  document.body.classList.remove("sidebar-open");
  updateChatNudge();
}
// Shows the persistent "Talk to your AI Advisor..." nudge (see .chat-nudge CSS) whenever a
// response has ever been emitted (S.chatResponded) AND the sidebar holding it is open — closing
// the sidebar hides the nudge too, since it would otherwise point at a message box the person
// can no longer see. Re-opening the sidebar (or emitting again) brings it right back.
function updateChatNudge(){
  const nudge = document.getElementById("chatNudge");
  if (!nudge) return;
  const sidebar = document.getElementById("chatSidebar");
  const show = !!S.chatResponded && !!(sidebar && sidebar.classList.contains("open"));
  nudge.classList.toggle("show", show);
  nudge.setAttribute("aria-hidden", String(!show));
}
function mockAdvisorResponse(question){
  // A recognized topic-button question gets its own expanded-restatement response (see
  // RESPONSE_TEXT above); free-typed questions (Fire-away / Help Chat) have no button to key
  // off of, so they keep this generic placeholder.
  return RESPONSE_TEXT[question] ||
    `This is a placeholder response. In the full product, this is where our AI Advisor's answer to "${question}" would appear.`;
}
// True for any Branch B ("the interview process") step — matched by condition shape rather
// than object identity, since resolveStep()/steps are plain data and NOT_ASKED_AI is just
// one particular {qid:"W001", op:"isNot", ...} object among possibly-copied equivalents.
function isBranchBStep(step){
  const cond = step.showIf;
  if (!cond) return false;
  const arr = Array.isArray(cond) ? cond : [cond];
  return arr.some(c => c && c.qid === "W001" && c.op === "isNot");
}
// The interview steps eligible for the emitted answer summary: Branch B only, and only
// ones with a real answerable input (skips the display-only tax-rate readout and the
// projections page).
function interviewSummarySteps(){
  return FIDUCIARY.steps.filter(step => {
    if (!isBranchBStep(step)) return false;
    const q = resolveStep(step);
    return q.renderer !== "info" && q.renderer !== "projections";
  });
}
// One row per interview step: the real answer if given, "Skipped" if the step was
// rendered but has no usable answer, or "Unseen" if the step was never rendered at all
// this session (S.seen, populated by renderQuestion(), is the source of truth for that).
function buildAnswerSummaryRows(){
  return interviewSummarySteps().map(step => {
    const q = resolveStep(step);
    const a = S.answers[q.qid];
    const unseen = !S.seen.has(q.qid);
    const answered = !unseen && hasAnswer(a);
    // muted is computed here (not by comparing the display string) so the Spanish labels
    // for Skipped/Unseen still style correctly.
    return { label: q.headline, value: unseen ? t("val_unseen") : (answered ? fmtAnswer(a) : t("val_skipped")), muted: !answered };
  });
}
function emitToChatSidebar(questionText){
  if (!questionText) return;
  const msg = document.getElementById("chatSidebarMessage");
  const resp = document.getElementById("chatSidebarResponse");
  if (msg){
    msg.innerHTML = "";
    msg.appendChild(el("div","csm-question", questionText));
    const summaryWrap = el("div","csm-summary");
    summaryWrap.appendChild(el("div","csm-summary-label", t("chat_summary_label")));
    buildAnswerSummaryRows().forEach(({label, value, muted}) => {
      const row = el("div","csm-row");
      row.appendChild(el("span","csm-row-label", label));
      row.appendChild(el("span","csm-row-value" + (muted ? " csm-row-muted" : ""), value));
      summaryWrap.appendChild(row);
    });
    msg.appendChild(summaryWrap);
  }
  if (resp) resp.textContent = mockAdvisorResponse(questionText);
  // Scroll the message area to its own bottom rather than the sidebar's: the Response box is
  // pinned outside this scrolling region (see .chat-sidebar-scroll/.chat-sidebar-response-wrap
  // CSS), so when the message content is too tall to fit, this scrolls its older/upper content
  // out of view while keeping the freshly-set Response fully visible below it.
  const scrollWrap = document.getElementById("chatSidebarScroll");
  if (scrollWrap) scrollWrap.scrollTop = scrollWrap.scrollHeight;
  // Once any response has been emitted, a persistent nudge shows in the main interview area
  // pointing back at the sidebar (see updateChatNudge()) — set before openChatSidebar() so its
  // own updateChatNudge() call already sees the flag.
  S.chatResponded = true;
  openChatSidebar();
}
// Shared by both "Fire away." (W002) and "How can I help?" (FID_HELP_CHAT): on Next/Send,
// emit whatever free-text question is currently in the page's box. MOVE-and-KEEP semantics:
// the submitted question travels verbatim into the sidebar's message box AND is stored as
// the step's answer (so later hand-off summaries show the last question asked, never
// "Skipped"), while the page's own big box clears, ready for a follow-up — Next/Send
// re-disable until something new is typed (see the chat branch in updateNavState()).
function emitCurrentChatAnswer(qid){
  const ta = document.querySelector("#stage textarea.free.chat");
  const text = ta && ta.value.trim();
  if (!text) return;
  Engine.setAnswer(qid, text);            // keep the last-sent question as this step's stored answer
  emitToChatSidebar(text);                // the summary built here shows it as this step's answer
  ta.value = "";
  ta.dispatchEvent(new Event("input"));   // autoGrow + syncSend + updateNavState → box shrinks, Send/Next disable
}
// The "x" in the corner is a close/exit affordance on every page. Browsers block
// scripted window.close() on tabs the user navigated to directly, so this can't
// actually close the tab in most real contexts — show a toast instead, same as
// the other not-wired-up prototype controls (chat attachments, voice input, etc.).
function closePage(){
  const app = document.getElementById("app");
  if (app.classList.contains("closing")) return;   // ignore repeat clicks mid-animation
  app.classList.add("closing");
  app.addEventListener("transitionend", function onEnd(e){
    if (e.propertyName !== "opacity") return;   // #app transitions both opacity and transform; only act once
    app.removeEventListener("transitionend", onEnd);
    app.style.display = "none";   // fully removed from layout — not just invisible
  });
}
function fmtAnswer(a){
  if (!a) return "—";
  if (a.skipped) return t("val_skipped");
  const f = flat(a.v);
  if (Array.isArray(f)) return f.join(", ");
  return String(f);
}
// Jump straight to a step by qid (used by the branch detours below) instead of by raw
// index — reads better at the call site and stays correct if steps get reordered.
function jumpToQid(qid){
  const idx = flow().steps.findIndex(s => s.qid === qid);
  if (idx >= 0) Engine.jump(idx);
}

/* ═══════════════ ENGINE ═══════════════ */
const Engine = {
  start(key, keepAnswers){
    S.flowKey = key; S.finished = false; S.preview = null; S.hist = [];
    if (!keepAnswers){ S.answers = {}; S.seen = new Set(); S.chatResponded = false; }
    lastDir = "next";
    seedHiddenDefaults();
    const vis = visibleSteps(flow(), S.answers);
    S.cur = vis.length ? vis[0] : 0;
    render();
  },
  visible(){ return visibleSteps(flow(), S.answers); },
  next(){
    const vis = this.visible();
    const pos = vis.indexOf(S.cur);
    lastDir = "next";
    if (pos === -1 || pos === vis.length - 1){ S.finished = true; render(); return; }
    S.hist.push(S.cur);
    S.cur = vis[pos + 1];
    render();
  },
  back(){
    lastDir = "back";
    if (S.finished){ S.finished = false; render(); return; }
    if (!S.hist.length) return;
    S.cur = S.hist.pop();
    render();
  },
  skip(){
    const q = resolveStep(flow().steps[S.cur]);
    S.answers[q.qid] = { v:null, skipped:true };
    this.next();
  },
  jump(idx){
    if (!condOk(flow().steps[idx].showIf, S.answers)){ toast("Step is hidden by its condition right now"); return; }
    if (S.finished) S.finished = false;
    lastDir = idx >= S.cur ? "next" : "back";
    if (idx !== S.cur){ S.hist.push(S.cur); S.cur = idx; }
    S.preview = null; render(); Panel.close();
  },
  setAnswer(qid, v){
    S.answers[qid] = { v, skipped:false };
    updateNavState();
  },
  restart(){ this.start(S.flowKey, false); toast("Flow restarted"); },
};

/* ═══════════════ STAGE RENDER ═══════════════ */
function render(){
  clearTimeout(autoT);
  const stage = document.getElementById("stage");
  const main = stage.parentElement;
  const dir = lastDir;

  // Directional "reel" transition: clone the outgoing content into a ghost that keeps
  // scrolling down (or up, on Back) and dissolving on its own, while the stage element is
  // rebuilt and scrolls in from the opposite edge to rest at its normal 120px-from-top spot.
  // Both layers move at the same px/ms rate (REEL_SPEED); each one's travel distance is its
  // own visible height (offsetHeight minus SCROLL_HEADROOM's invisible padding) plus the
  // 120px gap, so the exiting layer is fully clear — and fully faded —
  // right as the entering layer settles into place. Purely cosmetic, no state changes here.
  if (stage.children.length){
    const ghostDist = Math.max(0, stage.offsetHeight - SCROLL_HEADROOM) + reelGap();   // offsetHeight includes .stage's invisible 600px headroom padding — content only needs to travel its visible height
    const ghost = stage.cloneNode(true);
    ghost.removeAttribute("id");
    ghost.className = "stage stage-ghost reel-exit";
    ghost.style.setProperty("--reel-to", ((dir === "back" ? -1 : 1) * ghostDist) + "px");
    const ghostDur = Math.round(ghostDist / REEL_SPEED);
    ghost.style.animationDuration = ghostDur + "ms";
    main.appendChild(ghost);
    setTimeout(() => ghost.remove(), ghostDur + 60);
  }
  stage.innerHTML = "";
  stage.className = "stage";
  main.scrollTop = 0;

  // Applied once the new content is fully built (whichever branch below fires), so its
  // real rendered height is known before computing how far above the fold it should start.
  const enterStage = () => {
    const dist = Math.max(0, stage.offsetHeight - SCROLL_HEADROOM) + reelGap();   // same headroom exclusion as the ghost above
    stage.style.setProperty("--reel-from", ((dir === "back" ? 1 : -1) * dist) + "px");
    const dur = Math.round(dist / REEL_SPEED);
    stage.style.animationDuration = dur + "ms";
    // Briefly lock scrolling at the very start of the entrance animation (see the finish-
    // page fix this was originally added for — scrolling mid-transform could leave the
    // page at a position only valid mid-animation). Capped at a short fixed ceiling rather
    // than the full animation duration: on a long page (dist = height + gap) that duration
    // can run well past a second, which — on a page as tall as the projections step, with
    // its chart, six sliders, and note text — reads as "I can't scroll," not as a
    // transition. A brief lock still covers the original concern without ever being able
    // to block someone from reaching the bottom of a tall page for any noticeable time.
    main.style.overflowY = "hidden";
    setTimeout(() => { main.style.overflowY = "auto"; }, Math.min(dur + 30, 220));
    stage.classList.add("reel-enter");
  };

  document.getElementById("flowChip").textContent = S.preview ? "Preview" : flow().name;

  if (S.preview){
    renderQuestion(stage, resolveStep({qid:S.preview.qid}), {previewMode:true}); setProgress(0,0);
    enterStage(); return;
  }
  if (S.finished){ renderFinish(stage); setProgress(1,1,true); enterStage(); return; }

  const f = flow();
  if (!f.steps.length){
    stage.appendChild(el("h1","headline","This flow has no steps yet."));
    stage.appendChild(el("p","subhead","Open the control panel to pick a flow or build one."));
    setProgress(0,0); enterStage(); return;
  }
  const vis = Engine.visible();
  if (!vis.includes(S.cur)) S.cur = vis[0] ?? 0;
  const pos = vis.indexOf(S.cur);
  const q = resolveStep(f.steps[S.cur]);
  renderQuestion(stage, q, {pos, total:vis.length, hidden: f.steps.length - vis.length});
  setProgress(pos, vis.length);
  enterStage();
}
function setProgress(pos, total, full){
  const pct = full ? 100 : (total ? ((pos) / total) * 100 : 0);
  document.querySelector("#progressbar>div").style.width = pct + "%";
  document.getElementById("stepCount").textContent =
    S.preview ? "question preview" :
    full ? "complete" :
    total ? `${pos+1} of ${total}` : "";
}

function renderQuestion(stage, q, ctx){
  // Track every step actually rendered in a real (non-preview) session, so the emitted
  // answer summary (see buildAnswerSummaryText()) can tell "skipped" (rendered, no answer)
  // apart from "unseen" (never rendered at all) instead of guessing from S.answers alone.
  if (!ctx.previewMode) S.seen.add(q.qid);
  if (ctx.previewMode){
    const bn = el("div","preview-banner");
    bn.append(el("span",null,`Previewing ${q.qid} from the question bank — not part of the running flow.`));
    const x = el("button",null,"Exit preview");
    x.onclick = () => { S.preview = null; render(); };
    bn.appendChild(x);
    stage.appendChild(bn);
  }
  if (q.phase) stage.appendChild(el("div","phase", q.phase));
  if (S.settings.debug){
    const mb = el("div","meta-badges");
    mb.appendChild(el("span","badge", q.qid));
    mb.appendChild(el("span","badge sens-" + q.sens, "sensitivity: " + q.sens));
    if (q.pri != null) mb.appendChild(el("span","badge", "priority " + q.pri + (q.rank ? " · rank " + q.rank : "")));
    mb.appendChild(el("span","badge", q.input));
    if (ctx.hidden) mb.appendChild(el("span","badge", ctx.hidden + " step(s) hidden by logic"));
    stage.appendChild(mb);
  }
  const h1 = el("h1","headline");
  if (q.qid === "FID_TAXRATE"){
    h1.innerHTML = q.headline.replace("approximate", "<i>approximate</i>");
  } else {
    h1.textContent = q.headline;
  }
  stage.appendChild(h1);
  // Subheads hidden for now per design review — data still flows through (visible in the
  // Question bank tab, and "up to N" limits still parse from it). No step currently sets
  // forceSub:true, so this never renders; set it on a step to opt that one back in, or
  // drop the "&& q.forceSub" check to restore subheads everywhere.
  if (q.sub && q.forceSub) stage.appendChild(el("p","subhead", q.sub));

  const ans = el("div","answers");
  renderInput(ans, q);
  stage.appendChild(ans);

  const nav = el("div","nav");
  if (!ctx.previewMode){
    // FID_SUGGEST_TOPIC ("What do you want to know?") happens to be the last visible step in
    // the AI-chat branch, so ctx.pos would otherwise call for "Finish" here — but this page's
    // button now defers the chat hand-off (see its onclick below), so it reads "Next" like any
    // other step rather than implying the interview itself is done.
    const isLastStep = ctx.pos === ctx.total - 1;
    const next = el("button","btn primary",
      (q.qid === "FID_SUGGEST_TOPIC" || q.qid === "FID_OBJECTIVES") ? t("nav_next") :
      (q.qid === "FID_REGISTER") ? t("nav_register") :
      (isLastStep ? t("nav_finish") : t("nav_next")));
    next.id = "nextBtn";
    next.onclick = () => {
      if (q.qid === "FID_OBJECTIVES"){
        const picked = flat(S.answers.FID_OBJECTIVES && S.answers.FID_OBJECTIVES.v);
        if (Array.isArray(picked) && picked.includes("Something else")){
          // Gated by its own flag rather than reusing the W001-gated Fire-away step —
          // setting W001 here used to flip every NOT_ASKED_AI step invisible, including
          // Objectives itself, which broke Back (see FID_HELP_CHAT's showIf comment).
          Engine.setAnswer("FID_HELP_FLAG", true);
          jumpToQid("FID_HELP_CHAT");
          return;
        }
        // Hand-off waits for this Next click (it used to fire the moment a bubble was
        // picked): with exactly ONE real concern selected, Next emits that concern's
        // resolved question into the chat sidebar and stays put; with more than one, it
        // falls through to Engine.next() and advances to FID_NEXTSTEPS.
        const real = Array.isArray(picked) ? picked.filter(o => o !== "Something else") : [];
        if (real.length <= 1){
          if (real.length === 1) emitToChatSidebar(QUESTION_TEXT[real[0]] || real[0]);
          return;
        }
      }
      if (q.qid === "FID_HELP_CHAT"){ emitCurrentChatAnswer(q.qid); return; }   // was: jumpToQid("FID_END_INTERVIEW")
      if (q.qid === "FID_SUGGEST_TOPIC"){                                       // was: jumpToQid("FID_END_SUGGESTED")
        // Hand-off now waits for this Next click instead of firing the moment a topic bubble
        // is picked (see single() in renderInput()) — Next stays disabled until a topic is
        // chosen (updateNavState()), so `picked` is always set by the time this runs.
        const picked = S.answers.FID_SUGGEST_TOPIC && !S.answers.FID_SUGGEST_TOPIC.skipped ? S.answers.FID_SUGGEST_TOPIC.v : null;
        if (picked) emitToChatSidebar(QUESTION_TEXT[picked] || picked);
        return;
      }
      if (q.qid === "W002"){ emitCurrentChatAnswer(q.qid); return; }            // was: falls through to Engine.next() -> FID_END_DIRECT
      if (q.qid === "FID_NEXTSTEPS"){
        // Hand-off waits for this (Finish-labeled) click instead of firing on pick — same
        // deferred pattern as FID_SUGGEST_TOPIC. Next stays disabled until a topic is
        // chosen (updateNavState()), so `picked` is always set by the time this runs.
        const picked = S.answers.FID_NEXTSTEPS && !S.answers.FID_NEXTSTEPS.skipped ? S.answers.FID_NEXTSTEPS.v : null;
        if (picked) emitToChatSidebar(QUESTION_TEXT[picked] || picked);
        return;
      }
      Engine.next();
    };
    nav.appendChild(next);                       // flush left
    if (q.qid === "FID_REGISTER"){
      // PRODUCTION: Register Now must navigate to the host app's registration process
      // (see the FID_REGISTER step comment). In this prototype it needs no special onclick case —
      // register() below only ever lets it become enabled once S.answers.FID_REGISTER
      // already holds the real "First Last (email)" string, so the default Engine.next()
      // fallthrough at the end of this handler already does the right thing. This second,
      // white/orange-outline button is the explicit "skip registering" path.
      const skipReg = el("button","btn suggest",t("reg_skip"));
      skipReg.type = "button";
      skipReg.onclick = () => Engine.skip();
      nav.appendChild(skipReg);
    }
    if (q.qid === "W002"){
      const sug = el("button","btn primary suggest",t("nav_suggest"));
      sug.id = "suggestBtn";
      sug.type = "button";
      sug.onclick = () => {
        Engine.setAnswer("FID_SUGGEST_FLAG", true);
        Engine.next();
      };
      nav.appendChild(sug);
    }
    if (q.qid === "FID_NEXTSTEPS" || q.qid === "FID_OBJECTIVES"){
      const advisor = el("button","btn advisor",t("nav_advisor"));
      advisor.type = "button";
      advisor.onclick = () => {
        if (q.qid === "FID_OBJECTIVES"){
          // Sequence change: from THIS page, "Talk to AI Advisor" now routes to the
          // "How can I help?" chat instead of straight to the end. Same flag-then-jump
          // pattern as the "Something else" detour above, since FID_HELP_CHAT is gated
          // on FID_HELP_FLAG and Engine.jump() would otherwise refuse it as hidden.
          Engine.setAnswer("FID_HELP_FLAG", true);
          jumpToQid("FID_HELP_CHAT");
          return;
        }
        // FID_NEXTSTEPS: the eliminated FID_END_INTERVIEW page used to be this button's
        // destination — emit into the sidebar and stay here instead. Use whatever topic
        // was already picked on this page if there is one; otherwise a generic fallback,
        // since the button is clickable even before any topic here has been chosen.
        const picked = S.answers.FID_NEXTSTEPS && !S.answers.FID_NEXTSTEPS.skipped ? S.answers.FID_NEXTSTEPS.v : null;
        emitToChatSidebar(picked ? (QUESTION_TEXT[picked] || picked) : t("advisor_fallback"));
      };
      nav.appendChild(advisor);
    }
    const right = el("div","navright");          // "Back | Skip" flush right
    if (S.hist.length){
      const back = el("button","btn link",t("nav_back"));
      back.onclick = () => Engine.back();
      right.appendChild(back);
      right.appendChild(el("span","navsep","|"));
    }
    const skip = el("button","btn link skip",t("nav_skip"));
    skip.onclick = () => Engine.skip();
    right.appendChild(skip);
    nav.appendChild(right);
  }
  stage.appendChild(nav);
  // NOTE_TEXT entries are almost always a single plain string, but can be an array of
  // paragraph strings instead (see FID_PROJECTIONS) — each renders as its own
  // .below-next-note paragraph, picking up that class's margin-top as the gap between them.
  // Rendered via innerHTML (not textContent) so a paragraph can carry light inline markup
  // like <i> — safe here since every NOTE_TEXT value is first-party copy, never user input.
  const belowNoteRaw = (window.LANG === "es" && NOTE_TEXT_ES[q.qid]) || NOTE_TEXT[q.qid] ||
    "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
  (Array.isArray(belowNoteRaw) ? belowNoteRaw : [belowNoteRaw]).forEach(para => {
    const p = el("p","below-next-note" + (q.qid === "FID_REGISTER" ? " placeholder-note" : ""));
    p.innerHTML = para;
    stage.appendChild(p);
  });
  updateNavState();
}
function updateNavState(){
  const btn = document.getElementById("nextBtn");
  if (!btn) return;
  const q = resolveStep(flow().steps[S.cur]);
  if (q.renderer === "chat"){
    // Chat steps: Next tracks the BOX, not the stored answer — the answer retains the
    // last-sent question (so it appears in later hand-off summaries), while Next/Send
    // disable whenever the box is empty (e.g., right after a send clears it).
    const ta = document.querySelector("#stage textarea.free.chat");
    btn.disabled = !(ta && ta.value.trim());
  } else {
    btn.disabled = !hasAnswer(S.answers[q.qid]);
  }
  const sug = document.getElementById("suggestBtn");
  if (sug) sug.disabled = false;   // full blue from the start, regardless of chat content
}

/* ── input renderers ── */
function renderInput(root, q){
  const cur = S.answers[q.qid];
  const val = cur && !cur.skipped ? cur.v : undefined;
  const R = {
    single(){
      const wrap = el("div","pills");
      const btns = [];   // {opt, btn} pairs — resync-by-reference below, not by label text,
                         // since optLabel() can now show a translated Spanish label that no
                         // longer matches the English opt value textContent used to compare against.
      (q.opts||[]).forEach(o => {
        const p = el("button","pill" + (val === o ? " sel" : ""), optLabel(q.qid, o));
        p.setAttribute("aria-pressed", String(val === o));
        p.onclick = () => {
          Engine.setAnswer(q.qid, o);
          btns.forEach(({opt, btn}) => { btn.classList.toggle("sel", opt === o); btn.setAttribute("aria-pressed", String(opt === o)); });
          // (FID_NEXTSTEPS used to hand its question text to the chat sidebar the moment it
          // was picked — that hand-off now waits for the page's Finish button instead, the
          // same deferred pattern as FID_SUGGEST_TOPIC. See the nextBtn onclick above.)
          if (S.settings.autoAdvance && !S.preview) autoNext();
        };
        btns.push({opt:o, btn:p});
        wrap.appendChild(p);
      });
      root.appendChild(wrap);
    },
    multi(){
      const sel = Array.isArray(val) ? val.slice() : [];
      const excl = q.exclusive || [];
      const wrap = el("div","pills");
      const btns = [];
      const syncAll = () => btns.forEach(({opt, btn}) => { btn.classList.toggle("sel", sel.includes(opt)); btn.setAttribute("aria-pressed", String(sel.includes(opt))); });
      (q.opts||[]).forEach(o => {
        const p = el("button","pill" + (sel.includes(o) ? " sel" : ""), optLabel(q.qid, o));
        p.setAttribute("aria-pressed", String(sel.includes(o)));
        p.onclick = () => {
          if (excl.includes(o)){
            if (sel.includes(o)) sel.length = 0;
            else { sel.length = 0; sel.push(o); }
          } else {
            excl.forEach(e => { const ei = sel.indexOf(e); if (ei >= 0) sel.splice(ei,1); });
            const i = sel.indexOf(o);
            if (i >= 0) sel.splice(i,1);
            else {
              if (q.max && sel.length >= q.max){ toast(t("limit_choose") + q.max); return; }
              sel.push(o);
            }
          }
          Engine.setAnswer(q.qid, sel.slice());
          syncAll();
          // (FID_OBJECTIVES used to emit a lone selected concern's question into the chat
          // sidebar right here, on pick — that hand-off now waits for the Next button and
          // fires only when exactly one real concern is selected. See nextBtn's onclick.)
        };
        btns.push({opt:o, btn:p});
        wrap.appendChild(p);
      });
      root.appendChild(wrap);
      // "Choose up to N · x selected" helper line removed per design review.
      // The limit itself still applies (over-limit clicks show a brief toast).
    },
    combo(){
      const state = (val && typeof val === "object" && !Array.isArray(val)) ? {sel:(val.sel||[]).slice(), text:val.text||""} : {sel:Array.isArray(val)?val.slice():[], text:""};
      const wrap = el("div","pills");
      (q.opts||[]).forEach(o => {
        const p = el("button","pill" + (state.sel.includes(o) ? " sel" : ""), o);
        p.onclick = () => {
          const i = state.sel.indexOf(o);
          i >= 0 ? state.sel.splice(i,1) : state.sel.push(o);
          p.classList.toggle("sel");
          Engine.setAnswer(q.qid, {sel:state.sel.slice(), text:state.text});
        };
        wrap.appendChild(p);
      });
      root.appendChild(wrap);
      const t = el("input","textline combo-text");
      t.placeholder = "Something else? Type it here…";
      t.value = state.text;
      t.oninput = () => { state.text = t.value; Engine.setAnswer(q.qid, {sel:state.sel.slice(), text:state.text}); };
      root.appendChild(t);
    },
    scale(){
      const row = el("div","scale-row");
      for (let i = 1; i <= 5; i++){
        const b = el("button","scale-btn" + (val === i ? " sel" : ""), String(i));
        b.setAttribute("aria-pressed", String(val === i));
        b.onclick = () => {
          Engine.setAnswer(q.qid, i);
          row.querySelectorAll(".scale-btn").forEach((x,xi) => { x.classList.toggle("sel", xi === i-1); x.setAttribute("aria-pressed", String(xi === i-1)); });
          if (S.settings.autoAdvance && !S.preview) autoNext();
        };
        row.appendChild(b);
      }
      root.appendChild(row);
      const ends = el("div","scale-ends");
      ends.appendChild(el("span",null, q.scaleLabels[1] || "1 = low"));
      ends.appendChild(el("span",null, q.scaleLabels[5] || "5 = high"));
      root.appendChild(ends);
    },
    slider(){
      const r = q.range;
      let v = (typeof val === "number") ? val : r.def;
      // Next stays disabled until the person actually moves the slider (or edits the number
      // box) — showing a default value isn't the same as answering, so we don't auto-record it.
      const wrap = el("div","slider-wrap");
      const disp = el("div","slider-value");
      const num = el("input"); num.type = "number"; num.min = r.min; num.max = r.max; num.value = v;
      if (q.suffix){
        const numWrap = el("span","num-suffix-wrap");
        num.classList.add("has-suffix");
        numWrap.appendChild(num);
        numWrap.appendChild(el("span","num-suffix", q.suffix));
        disp.appendChild(numWrap);
      } else {
        disp.appendChild(num);
      }
      const range = el("input"); range.type = "range"; range.min = r.min; range.max = r.max; range.value = v;
      const paint = () => paintRangeTrack(range, ((v - r.min) / (r.max - r.min)) * 100);
      const sync = nv => {
        v = Math.max(r.min, Math.min(r.max, Number(nv) || r.min));
        num.value = v; range.value = v;
        Engine.setAnswer(q.qid, v);
        paint();
      };
      range.oninput = () => sync(range.value);
      num.oninput = () => {           // don't clamp mid-typing
        const n = Number(num.value);
        if (num.value !== "" && n >= r.min && n <= r.max){ v = n; range.value = n; Engine.setAnswer(q.qid, n); paint(); }
      };
      num.onblur = () => sync(num.value);
      paint();
      wrap.appendChild(disp); wrap.appendChild(range);
      const mm = el("div","slider-minmax");
      const suf = q.suffix || "";
      mm.appendChild(el("span",null, r.min + suf)); mm.appendChild(el("span",null, r.max + suf));
      wrap.appendChild(mm);
      root.appendChild(wrap);
      if (r.generic) root.appendChild(el("div","fallback-note","No range defined in the bank — using 0–100 placeholder."));
    },
    // Dollar-amount slider (Income, Assets, Home value, Mortgage balance) — genuinely
    // logarithmic: the handle's physical position maps to dollars through a power
    // curve, so dragging covers small amounts near the left and huge amounts near
    // the right. The result is still snapped to round increments per bracket.
    moneyslider(){
      const r = q.range;
      let v = (typeof val === "number") ? val : r.def;
      // Same as slider() above: Next stays grayed out until the handle is actually dragged
      // (or the number box edited) — the default position alone doesn't count as an answer.
      const brackets = q.brackets || MONEY_BRACKETS;
      const snap = n => { const b = brackets.find(x => n >= x[0] && n < x[1]) || brackets[brackets.length-1]; return Math.round(n / b[2]) * b[2]; };
      // Abbreviated as "$20k" / "$1,000k" rather than "$20,000" / "$1,000,000".
      const fmt = n => "$" + Math.round(n / 1000).toLocaleString("en-US") + "k";
      const RES = 1000, CURVE = 3.5;   // higher CURVE = flatter at the low end, sharper upswing near the right
      const toPos = dollars => Math.round(RES * Math.pow(Math.max(0, dollars - r.min) / (r.max - r.min), 1 / CURVE));
      const toDollars = pos => r.min + (r.max - r.min) * Math.pow(pos / RES, CURVE);
      const wrap = el("div","slider-wrap");
      const disp = el("div","slider-value money", fmt(v));
      const range = el("input"); range.type = "range"; range.min = 0; range.max = RES; range.step = 1; range.value = toPos(v);
      const paint = () => paintRangeTrack(range, (Number(range.value) / RES) * 100);
      const sync = posRaw => {
        v = snap(Math.max(r.min, Math.min(r.max, toDollars(Number(posRaw)))));
        range.value = toPos(v); disp.textContent = fmt(v);
        Engine.setAnswer(q.qid, v);
        paint();
      };
      range.oninput = () => sync(range.value);
      paint();
      wrap.appendChild(disp); wrap.appendChild(range);
      const mm = el("div","slider-minmax");
      mm.appendChild(el("span",null, fmt(r.min))); mm.appendChild(el("span",null, fmt(r.max)));
      wrap.appendChild(mm);
      root.appendChild(wrap);
    },
    // (The old "blank" renderer for the eliminated FID_END_* placeholder pages was removed
    // along with those pages — no remaining question uses a "Blank" input.)
    // Read-only "here's your estimate" step (Marginal tax rate). Doesn't collect an
    // answer, just needs an acknowledgment so Next enables. Numbers are illustrative
    // placeholders, not a real tax calculation.
    info(){
      if (val === undefined) Engine.setAnswer(q.qid, true);
      const incomeAns = S.answers["FID_INCOME"];
      const income = (incomeAns && !incomeAns.skipped) ? Number(incomeAns.v) || 0 : 0;
      const partnerAns = S.answers["FID_PARTNER"];
      const filingKey = (partnerAns && !partnerAns.skipped && partnerAns.v === "With a spouse or partner") ? "mfj" : "single";
      // Marginal — the rate on your next dollar, not a blended/average rate — so each
      // piece jumps at a threshold instead of ramping smoothly. Brackets are illustrative.
      const federalBrackets = [[0,12],[47000,22],[100000,24],[200000,32],[500000,37]];
      const federal = federalBrackets.reduce((r, [floor, pct]) => income >= floor ? pct : r, federalBrackets[0][1]);
      // 3.8% Net Investment Income Tax — the "Obamacare tax" that actually applies to interest
      // income and short-term capital gains (this page's scope). Not the 0.9% Additional
      // Medicare Tax, which only applies to wages/self-employment income, not investment income.
      // Kicks in AT the threshold (>=, so exactly $200,000/$250,000 shows the 3.8%):
      // $200,000 single / $250,000 married filing jointly, per the real NIIT MAGI thresholds.
      const niitThreshold = filingKey === "mfj" ? 250000 : 200000;
      const obamacare = income >= niitThreshold ? 3.8 : 0;

      // Wrap + rebuild-in-place: re-entering the top-level render() from inside a step's
      // own renderer would corrupt the DOM (render() is already mid-execution), so instead
      // this local wrap is torn down and rebuilt by buildTable() whenever the ZIP changes.
      const wrap = el("div","taxrate-wrap");
      wrap.setAttribute("aria-live","polite");   // the table rebuilds in place when a ZIP is entered on this step
      root.appendChild(wrap);

      const buildTable = () => {
        wrap.innerHTML = "";
        const zipAns = S.answers["FID_ZIP"];
        const zipVal = (zipAns && !zipAns.skipped) ? zipAns.v : null;
        const validZip = typeof zipVal === "string" && /^\d{5}$/.test(zipVal);
        const outsideUS = zipVal === "Outside the U.S.";

        let stateLabel = t("taxrate_state_fallback"), statePct = 0, localLabel = t("taxrate_local_fallback"), localPct = 0;
        if (validZip){
          const r = computeTaxRates(zipVal, filingKey, income);
          stateLabel = r.stateLabel; statePct = r.statePct * 100;
          localLabel = r.localLabel; localPct = r.localPct * 100;
        }

        if (!validZip && !outsideUS){
          // ZIP hasn't been entered (or was skipped) — ask again right here.
          wrap.appendChild(el("p","notice-orange", t("taxrate_missing_zip")));
          const row = el("div","zip-row");
          const inp = el("input","textline zip");
          inp.placeholder = t("zip_placeholder");
          inp.maxLength = 5; inp.inputMode = "numeric"; inp.autocomplete = "postal-code";
          inp.oninput = () => {
            const digits = inp.value.replace(/\D/g, "");
            if (inp.value !== digits) inp.value = digits;
            if (/^\d{5}$/.test(digits)){
              Engine.setAnswer("FID_ZIP", digits);
              buildTable();
            }
          };
          row.appendChild(inp);
          wrap.appendChild(row);
        } else if (outsideUS){
          wrap.appendChild(el("p","notice-orange", t("taxrate_outside")));
        }

        const total = federal + obamacare + statePct + localPct;
        const table = el("div","taxrate-table");
        // "total" key (not the display label) drives the bold/total row styling, since the
        // Spanish label for "Total" is spelled the same as English but nothing else here
        // should have to rely on that coincidence.
        [["federal", t("taxrate_federal"), federal], ["obamacare", t("taxrate_obamacare"), obamacare],
         ["state", stateLabel, statePct], ["local", localLabel, localPct], ["total", t("taxrate_total"), total]]
          .forEach(([key, label, pct]) => {
            const row = el("div","taxrate-row" + (key === "total" ? " total" : ""));
            row.appendChild(el("span","trl", label));
            row.appendChild(el("span","trv", pct.toFixed(1) + "%"));
            table.appendChild(row);
          });
        wrap.appendChild(table);
      };
      buildTable();
    },
    // Highly simplified stand-in for the full Lifetime Planning component (see the
    // uploaded SC-007_Lifetime_Planning_Prototype.html reference): projects the answers
    // already collected earlier in this interview (age, income, savings rate, investment
    // assets, home value/mortgage) forward as an annual stacked-bar chart, with a single
    // "retirement age" slider driving the vertical retire line. computeProjectionRows()/
    // buildProjectionSVG() (defined near paintRangeTrack, above) do the actual math/drawing.
    projections(){
      if (val === undefined) Engine.setAnswer(q.qid, true);
      const wrap = el("div","proj-wrap");
      root.appendChild(wrap);

      const chartFrame = el("div","proj-chart-frame");
      const legend = el("div","proj-legend");
      legend.innerHTML =
        `<span><i style="background:var(--proj-invest)"></i>${t("proj_legend_invest")}</span>` +
        `<span><i style="background:var(--proj-home)"></i>${t("proj_home_equity")}</span>` +
        `<span><i class="line"></i>${t("proj_retire_label")}</span>`;
      wrap.appendChild(chartFrame);
      wrap.appendChild(legend);

      const slidersWrap = el("div","proj-sliders");
      wrap.appendChild(slidersWrap);

      // Each of the six sliders below remembers its own last-dragged position across
      // re-visits to this same step (FID_PROJ_*, an internal widget qid — not a real
      // interview answer). The very first time this step is seen, each slider instead
      // defaults from the matching earlier-page answer, if the person gave one.
      const PERSIST_QID = { age0:"FID_PROJ_AGE", income0:"FID_PROJ_INCOME", srate:"FID_PROJ_SRATE",
                            assets0:"FID_PROJ_ASSETS", homeEq0:"FID_PROJ_HOMEEQ", retireAge:"FID_PROJ_RETIRE_AGE" };
      const persisted = key => { const a = S.answers[PERSIST_QID[key]]; return (a && !a.skipped) ? Number(a.v) : null; };
      const prevAns = qid => S.answers[qid];
      const prevNum = (qid, dflt) => { const a = prevAns(qid); return (a && !a.skipped) ? (Number(a.v) || 0) : dflt; };

      const homeAns = prevAns("FID_HOME");
      const owns = !!(homeAns && !homeAns.skipped && homeAns.v === "Own");
      const homeEquityFromPages = owns ? Math.max(0, prevNum("FID_HOME_VALUE", 0) - prevNum("FID_MORTGAGE", 0)) : 0;

      const values = {
        age0:    persisted("age0")    != null ? persisted("age0")    : prevNum("FID_AGE", 40),
        income0: persisted("income0") != null ? persisted("income0") : prevNum("FID_INCOME", 75000),
        srate:   persisted("srate")   != null ? persisted("srate")   : prevNum("FID_SAVINGSRATE", 15),
        assets0: persisted("assets0") != null ? persisted("assets0") : prevNum("FID_ASSETS", 50000),
        homeEq0: persisted("homeEq0") != null ? persisted("homeEq0") : homeEquityFromPages,
        retireAge: 65,
      };
      values.retireAge = persisted("retireAge") != null ? persisted("retireAge") : 65;

      // Frozen once, from whatever the income slider was defaulted to right now — not
      // recomputed as the income slider (or any other slider) is dragged afterward. See
      // the comment in computeProjectionRows() for why this exists: retirement spending
      // used to scale directly with income, which made outcomes look worse the higher you
      // dragged income (spending grew faster than the pre-retirement contributions that
      // same drag added).
      values.retSpendFixed = values.income0 * 0.70;

      const redrawChart = () => {
        chartFrame.innerHTML = buildProjectionSVG(computeProjectionRows(values), values.retireAge);
      };

      // A plain linear slider row (number box + range) — same look/feel as the slider()
      // renderer used elsewhere in this interview (Age, Savings rate, and here also
      // Retirement age).
      const buildLinearRow = (label, key, range, suffix) => {
        const row = el("div","proj-slider-item");
        // Label and value share one row (value flush to the right edge, above where the
        // track will sit) instead of stacking the value on its own line — saves a full
        // line of height per slider, times six.
        const labelRow = el("div","proj-slider-item-label");
        labelRow.appendChild(el("span",null,label));
        const disp = el("div","slider-value");
        const num = el("input"); num.type = "number"; num.min = range.min; num.max = range.max; num.value = values[key];
        if (suffix){
          const numWrap = el("span","num-suffix-wrap");
          num.classList.add("has-suffix");
          numWrap.appendChild(num);
          numWrap.appendChild(el("span","num-suffix", suffix));
          disp.appendChild(numWrap);
        } else {
          disp.appendChild(num);
        }
        labelRow.appendChild(disp);
        row.appendChild(labelRow);

        const wrapEl = el("div","slider-wrap");
        const rangeEl = el("input"); rangeEl.type = "range"; rangeEl.min = range.min; rangeEl.max = range.max; rangeEl.value = values[key];
        const paint = () => paintRangeTrack(rangeEl, ((values[key] - range.min) / (range.max - range.min)) * 100);
        const sync = nv => {
          values[key] = Math.max(range.min, Math.min(range.max, Number(nv) || range.min));
          num.value = values[key]; rangeEl.value = values[key];
          Engine.setAnswer(PERSIST_QID[key], values[key]);
          paint(); redrawChart();
        };
        rangeEl.oninput = () => sync(rangeEl.value);
        num.oninput = () => {
          const n = Number(num.value);
          if (num.value !== "" && n >= range.min && n <= range.max){
            values[key] = n; rangeEl.value = n;
            Engine.setAnswer(PERSIST_QID[key], n);
            paint(); redrawChart();
          }
        };
        num.onblur = () => sync(num.value);

      };

      // A logarithmic dollar-amount slider row — same look/feel and curve as the
      // moneyslider() renderer used elsewhere in this interview (Income, Assets, Home
      // equity here).
      const buildMoneyRow = (label, key, range) => {
        const row = el("div","proj-slider-item");
        const labelRow = el("div","proj-slider-item-label");
        labelRow.appendChild(el("span",null,label));
        const brackets = MONEY_BRACKETS;
        const snap = n => { const b = brackets.find(x => n >= x[0] && n < x[1]) || brackets[brackets.length-1]; return Math.round(n / b[2]) * b[2]; };
        const fmt = n => "$" + Math.round(n / 1000).toLocaleString("en-US") + "k";
        const RES = 1000, CURVE = 3.5;
        const toPos = dollars => Math.round(RES * Math.pow(Math.max(0, dollars - range.min) / (range.max - range.min), 1 / CURVE));
        const toDollars = pos => range.min + (range.max - range.min) * Math.pow(pos / RES, CURVE);
        const disp = el("div","slider-value money", fmt(values[key]));
        labelRow.appendChild(disp);
        row.appendChild(labelRow);

        const wrapEl = el("div","slider-wrap");
        const rangeEl = el("input"); rangeEl.type = "range"; rangeEl.min = 0; rangeEl.max = RES; rangeEl.step = 1; rangeEl.value = toPos(values[key]);
        const paint = () => paintRangeTrack(rangeEl, (Number(rangeEl.value) / RES) * 100);
        const sync = posRaw => {
          values[key] = snap(Math.max(range.min, Math.min(range.max, toDollars(Number(posRaw)))));
          rangeEl.value = toPos(values[key]); disp.textContent = fmt(values[key]);
          Engine.setAnswer(PERSIST_QID[key], values[key]);
          paint(); redrawChart();
        };
        rangeEl.oninput = () => sync(rangeEl.value);
        paint();
        wrapEl.appendChild(rangeEl);
        const mm = el("div","slider-minmax");
        mm.appendChild(el("span",null, fmt(range.min))); mm.appendChild(el("span",null, fmt(range.max)));
        wrapEl.appendChild(mm);
        row.appendChild(wrapEl);
        slidersWrap.appendChild(row);
      };

      buildLinearRow(t("proj_current_age"), "age0", {min:18, max:90});
      buildMoneyRow(t("proj_income"), "income0", {min:1000, max:1000000});
      buildLinearRow(t("proj_savings_rate"), "srate", {min:0, max:40}, "%");
      buildMoneyRow(t("proj_assets"), "assets0", {min:0, max:10000000});
      buildMoneyRow(t("proj_home_equity"), "homeEq0", {min:0, max:10000000});
      buildLinearRow(t("proj_retire_age"), "retireAge", {min:50, max:80});

      redrawChart();
    },
    // Lightweight lead-capture form (First name / Last name / Email). Deliberately doesn't

    register(){

      const validate = () => {
        const filled = !!(state.first.trim() && state.last.trim() && state.email.trim());

        Engine.setAnswer("FID_REGISTER", ready ? `${state.first.trim()} ${state.last.trim()} (${state.email.trim()})` : "");

      wrap.appendChild(mkField("email", t("reg_email"), "email", "email"));

    },
    chat(){
      const wrap = el("div","chat-input-wrap");
      // Named ta (not t) — this renderer needs the global t() translation helper too, which a
      // local "const t = ..." would otherwise shadow for the rest of this function.
      const ta = el("textarea","free chat");
      ta.placeholder = t("chat_placeholder");
      // The box always mounts empty: the draft being typed lives only in the DOM, while the
      // step's STORED answer holds the last-sent question (see emitCurrentChatAnswer()) so
      // later hand-off summaries show what was asked. A re-render mid-draft (e.g. the
      // language toggle) therefore drops an unsent draft — acceptable for this prototype.
      ta.value = "";

      mic.onclick = () => toast(t("chat_voice_toast"));

      const send = el("button","chat-icon-btn send"); send.type = "button"; send.title = t("chat_ask");
      send.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6"/><path d="M6 12l6-6 6 6"/></svg>';
      send.disabled = true;
      send.onclick = () => {
        if (send.disabled) return;
        if (q.qid === "FID_HELP_CHAT"){ emitCurrentChatAnswer(q.qid); return; }   // was: jumpToQid("FID_END_INTERVIEW")
        if (q.qid === "W002"){ emitCurrentChatAnswer(q.qid); return; }            // was: falls through to Engine.next() -> FID_END_DIRECT
        Engine.next();
      };

      const autoGrow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 260) + "px"; };
      const syncSend = () => { const has = !!ta.value.trim(); send.disabled = !has; send.classList.toggle("ready", has); };
      // Typing no longer writes into S.answers — the draft is DOM-only; only SENDING stores
      // it (as the last-sent question, via emitCurrentChatAnswer). Next's enabled state on
      // chat steps reads the box directly (see updateNavState's chat branch).
      ta.oninput = () => { autoGrow(); syncSend(); updateNavState(); };
      // Enter submits (same as the send icon); Shift+Enter still makes a newline. The global

      // own submit path.
      ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send.click(); } };

      // via Back). Instead, wait for however long THIS render's entrance animation actually
      // takes — already computed and stored on #stage by enterStage() by the time this runs.
      const stageEl = document.getElementById("stage");

    zip(){

      lbl.append(cb, t("zip_outside_label"));

      notice.style.display = isOutside ? "" : "none";
      const apply = () => {

        } else {
          inp.disabled = false;
          const digits = inp.value.replace(/\D/g, "");
          if (inp.value !== digits) inp.value = digits;
          Engine.setAnswer(q.qid, /^\d{5}$/.test(digits) ? digits : null);  // Next goes blue at 5 digits
        }
        notice.style.display = cb.checked ? "" : "none";
      };
      inp.oninput = apply; cb.onchange = apply;
      row.append(inp, lbl);
      root.appendChild(row);
      root.appendChild(notice);
      // Land with focus already in the field (border goes orange via the shared
      // input.textline:focus rule). Same settle-delay pattern as chat()'s autofocus —
      // focusing before the reel entrance animation finishes can make the browser
      // auto-scroll the field into view mid-transform and fight the custom scroll.
      const stageEl = document.getElementById("stage");
      const settleMs = stageEl ? (parseFloat(stageEl.style.animationDuration) || 0) : 0;

    },
    search(){
      const list = q.searchList;
      const wrap = el("div","search-wrap");

      entry.appendChild(inp); entry.appendChild(add);
      root.appendChild(entry); root.appendChild(chipsRow); paint();
    },
  };
  (R[q.renderer] || R.text)();
}

function renderFinish(stage){
  const f = flow();
  // Fiduciary never shows the generic stats/summary screen. With Next/Send intercepted on
  // every terminal step (and Enter now clicking the real button — see the keydown handler),
  // the only way to advance past Fiduciary's last visible step is the universal Skip button;
  // that lands here, on a minimal closing hand-off screen pointing at the chat surface.
  // Deliberately nothing else on it: no nav, no stats, no summary (per design request).
  if (f.key === "fiduciary"){
    const box = el("div","finish");
    box.appendChild(el("div","phase", t("closing_eyebrow")));
    box.appendChild(el("h1","headline", t("closing_headline")));
    box.appendChild(el("p","subhead", t("closing_copy")));
    stage.appendChild(box);
    return;
  }
  const vis = Engine.visible();
  const answered = vis.filter(i => hasAnswer(S.answers[resolveStep(f.steps[i]).qid])).length;
  const skipped = vis.filter(i => (S.answers[resolveStep(f.steps[i]).qid] || {}).skipped).length;
  const hidden = f.steps.length - vis.length;

  const box = el("div","finish");
  box.appendChild(el("div","phase", t("fin_eyebrow")));
  box.appendChild(el("h1","headline", t("fin_headline")));
  box.appendChild(el("p","subhead", t("fin_subhead")));

  const stats = el("div","finish-stats");
  const stat = (n, l) => { const s = el("div","stat"); s.appendChild(el("b",null,String(n))); s.append(l); return s; };
  stats.appendChild(stat(answered, t("fin_answered")));
  stats.appendChild(stat(skipped, t("fin_skipped")));
  if (hidden) stats.appendChild(stat(hidden, t("fin_hidden")));
  box.appendChild(stats);

  const sum = el("div","summary");
  vis.forEach(i => {
    const q = resolveStep(f.steps[i]);
    const row = el("div","sumrow");
    row.appendChild(el("span","sid", q.qid));
    row.appendChild(el("span","sq", q.headline));
    const a = S.answers[q.qid];
    row.appendChild(el("span","sa" + (hasAnswer(a) ? "" : " skipped"), fmtAnswer(a)));
    sum.appendChild(row);
  });
  box.appendChild(sum);

  const nav = el("div","nav");
  const again = el("button","btn primary", t("fin_restart"));
  again.onclick = () => Engine.restart();
  const backB = el("button","btn link", t("fin_back"));
  backB.onclick = () => Engine.back();
  const copy = el("button","btn ghost", t("fin_copy"));
  copy.onclick = () => {
    navigator.clipboard.writeText(exportAnswers()).then(() => toast(t("fin_copied")));
  };
  nav.append(again, backB, copy);
  box.appendChild(nav);
  stage.appendChild(box);
}
function exportAnswers(){
  const f = flow();
  const out = { flow: f.name, exportedAt: new Date().toISOString(), answers: {} };
  Engine.visible().forEach(i => {
    const q = resolveStep(f.steps[i]);
    const a = S.answers[q.qid];
    out.answers[q.qid] = { question: q.headline, value: a && !a.skipped ? a.v : null, skipped: !!(a && a.skipped) };
  });
  return JSON.stringify(out, null, 2);
}

const GEN = { count:10, maxSens:"Medium", needOpts:true, balance:true };
function rendererNoOptsOk(input){ return /scale|slider|free|chips|search/i.test(input || ""); }
function generateSteps(){
  const sensRank = {Low:1, Medium:2, High:3};
  let pool = DATA.bank.filter(b =>
    (sensRank[b.sens] || 1) <= sensRank[GEN.maxSens] &&
    (!GEN.needOpts || b.opts || rendererNoOptsOk(b.input))
  );
  pool = pool.slice().sort((a,b) => (b.pri ?? 0) - (a.pri ?? 0));
  let pick;
  if (GEN.balance){
    const byBucket = {}; BUCKET_ORDER.forEach(b => byBucket[b] = []);
    pool.forEach(p => (byBucket[p.bucket] || (byBucket[p.bucket]=[])).push(p));
    pick = [];
    let added = true;
    while (pick.length < GEN.count && added){
      added = false;
      for (const b of BUCKET_ORDER){
        if (pick.length >= GEN.count) break;
        const nxt = (byBucket[b] || []).shift();
        if (nxt){ pick.push(nxt); added = true; }
      }
    }
  } else pick = pool.slice(0, GEN.count);
  const bo = x => { const i = BUCKET_ORDER.indexOf(x.bucket); return i < 0 ? 99 : i; };
  pick.sort((a,b) => bo(a) - bo(b) || (sensRank[a.sens]||1) - (sensRank[b.sens]||1) || (b.pri ?? 0) - (a.pri ?? 0));
  return pick.map(p => ({ qid: p.id }));
}
function paintBuilder(body){

  const cnt = el("input"); cnt.type = "number"; cnt.min = 3; cnt.max = 40; cnt.value = GEN.count;
  cnt.oninput = () => GEN.count = Math.max(3, Math.min(40, +cnt.value || 10));
  grid.appendChild(mk("Number of questions", cnt));
  const sens = el("select");
  ["Low","Medium","High"].forEach(s => { const o = el("option",null, s === "High" ? "High (allow everything)" : "Up to " + s); o.value = s; if (GEN.maxSens === s) o.selected = true; sens.appendChild(o); });
  sens.onchange = () => GEN.maxSens = sens.value;
  grid.appendChild(mk("Max sensitivity", sens));
  body.appendChild(grid);
  const c1 = el("label","checkrow"); const cb1 = el("input"); cb1.type = "checkbox"; cb1.checked = GEN.needOpts;
  cb1.onchange = () => GEN.needOpts = cb1.checked;

  body.appendChild(c1);
  const c2 = el("label","checkrow"); const cb2 = el("input"); cb2.type = "checkbox"; cb2.checked = GEN.balance;
  cb2.onchange = () => GEN.balance = cb2.checked;
  c2.append(cb2, "Balance across buckets (round-robin by priority) instead of pure top-N");
  body.appendChild(c2);
  const bar = el("div","toolbar");
  const gen = el("button","mini solid","Generate → replace draft");
  gen.onclick = () => {
    S.draft.steps = generateSteps();
    S.draft.name = `Generated · top ${S.draft.steps.length} (≤ ${GEN.maxSens} sensitivity)`;
    Panel.paint(); toast(`Generated ${S.draft.steps.length} steps, ordered life-first → intent`);
  };
  bar.appendChild(gen);
  body.appendChild(bar);
  body.appendChild(el("div","fdesc","Selection: rank by the bank’s Priority score, filter by sensitivity. Ordering: bucket sequence (life & context → mindset → goals → financial → intent), escalating sensitivity within each bucket — per the legend tab’s ordering principles."));

  body.appendChild(el("div","psec-title","Draft flow"));
  const nameRow = el("div","toolbar");
  const nameIn = el("input","draftname-input"); nameIn.type = "text"; nameIn.value = S.draft.name;
  nameIn.oninput = () => S.draft.name = nameIn.value;
  nameRow.appendChild(nameIn);
  const save = el("button","mini solid","Save as flow");
  save.onclick = () => {
    if (!S.draft.steps.length){ toast("Draft is empty"); return; }
    const key = "custom" + (++customCount);
    FLOWS.push({ key, name: S.draft.name || key, desc: "Custom flow built in the control panel.", steps: JSON.parse(JSON.stringify(S.draft.steps)) });
    toast("Saved — see Flows tab");
  };
  const runD = el("button","mini","Run draft now");
  runD.onclick = () => {
    if (!S.draft.steps.length){ toast("Draft is empty"); return; }
    const key = "draftrun";
    FLOWS = FLOWS.filter(f => f.key !== key);
    FLOWS.push({ key, name: S.draft.name + " (draft)", desc:"Unsaved draft run.", steps: JSON.parse(JSON.stringify(S.draft.steps)) });
    Engine.start(key); Panel.close();
  };
  const clr = el("button","mini warn","Clear");
  clr.onclick = () => { S.draft.steps = []; Panel.paint(); };
  nameRow.append(save, runD, clr);
  body.appendChild(nameRow);

  if (!S.draft.steps.length){
    body.appendChild(el("div","empty-note","Draft is empty. Generate above, copy a flow from the Flows tab, or add questions from the Question bank tab."));
  }
  S.draft.steps.forEach((st, i) => {
    const q = resolveStep(st);
    const row = el("div","draftrow");
    row.appendChild(el("span","n", String(i+1) + "."));
    row.appendChild(el("span","qid", st.qid));
    row.appendChild(el("span","qt", q.headline));
    const d = describeCond(st.showIf);
    if (d) row.appendChild(el("span","condtag", d));
    const btns = el("div","cbtns");
    const mkb = (t, fn, title) => { const b = el("button","icon-btn", t); b.title = title || ""; b.onclick = fn; return b; };
    btns.appendChild(mkb("↑", () => { if (i > 0){ [S.draft.steps[i-1], S.draft.steps[i]] = [S.draft.steps[i], S.draft.steps[i-1]]; Panel.paint(); } }, "Move up"));
    btns.appendChild(mkb("↓", () => { if (i < S.draft.steps.length-1){ [S.draft.steps[i+1], S.draft.steps[i]] = [S.draft.steps[i], S.draft.steps[i+1]]; Panel.paint(); } }, "Move down"));
    btns.appendChild(mkb(st.showIf ? "edit if" : "+ if", () => { st._editCond = !st._editCond; Panel.paint(); }, "Condition: show this step only if…"));
    btns.appendChild(mkb("✕", () => { S.draft.steps.splice(i,1); Panel.paint(); }, "Remove"));
    row.appendChild(btns);
    body.appendChild(row);

    if (st._editCond){
      const ed = el("div","cond-editor");
      ed.appendChild(el("span",null,"Show only if"));
      const qSel = el("select");
      const earlier = S.draft.steps.slice(0, i);
      const blank = el("option",null,"— pick question —"); blank.value = ""; qSel.appendChild(blank);
      earlier.forEach(e2 => {
        const o = el("option",null, e2.qid + " · " + (resolveStep(e2).headline || "").slice(0,42)); o.value = e2.qid; qSel.appendChild(o);
      });
      const opSel = el("select");
      [["is","is"],["isNot","is not"],["includes","includes"],["notIncludes","doesn’t include"],["answered","was answered"]].forEach(([v,l]) => { const o = el("option",null,l); o.value = v; opSel.appendChild(o); });
      const vSel = el("select");
      const paintVals = () => {
        vSel.innerHTML = "";
        const src = resolveStep({qid: qSel.value});
        (src.opts || []).forEach(o2 => { const o = el("option",null,o2); o.value = o2; vSel.appendChild(o); });
        if (!src.opts){ const o = el("option",null,"(no options — use “was answered”)"); o.value = ""; vSel.appendChild(o); }
        vSel.style.display = opSel.value === "answered" ? "none" : "";
      };
      const cur = st.showIf && !Array.isArray(st.showIf) && !st.showIf.any ? st.showIf : null;
      if (cur){ qSel.value = cur.qid; }
      qSel.onchange = paintVals; opSel.onchange = paintVals;
      if (cur){ opSel.value = cur.op; paintVals(); if (cur.value) vSel.value = cur.value; } else paintVals();
      const apply = el("button","mini solid","Apply");
      apply.onclick = () => {
        if (!qSel.value){ toast("Pick a question first"); return; }
        st.showIf = opSel.value === "answered" ? {qid:qSel.value, op:"answered"} : {qid:qSel.value, op:opSel.value, value:vSel.value};
        st._editCond = false; Panel.paint();
      };
      const rm = el("button","mini warn","Remove condition");
      rm.onclick = () => { delete st.showIf; st._editCond = false; Panel.paint(); };
      ed.append(qSel, opSel, vSel, apply, rm);
      body.appendChild(ed);
    }
  });

  body.appendChild(el("div","psec-title","Import / export flow JSON"));
  const io = el("textarea","io");
  io.placeholder = '{"name":"…","steps":[{"qid":"Q019"},{"qid":"Q003","showIf":{"qid":"Q001","op":"is","value":"With a spouse or partner"}}]}';
  io.value = S.draft.steps.length ? JSON.stringify({name:S.draft.name, steps:S.draft.steps.map(({_editCond, ...s}) => s)}, null, 1) : "";
  body.appendChild(io);
  const iobar = el("div","toolbar");
  const imp = el("button","mini","Load JSON into draft");
  imp.onclick = () => {
    try {
      const j = JSON.parse(io.value);
      if (!Array.isArray(j.steps)) throw new Error("steps must be an array");
      const bad = j.steps.find(s2 => !BANK[s2.qid]);
      if (bad) throw new Error("Unknown question id: " + bad.qid);
      S.draft = { name: j.name || "Imported flow", steps: j.steps };
      Panel.paint(); toast("Imported");
    } catch(e){ toast("Invalid JSON: " + e.message); }
  };
  const cp = el("button","mini","Copy JSON");
  cp.onclick = () => navigator.clipboard.writeText(io.value).then(() => toast("Copied"));
  iobar.append(imp, cp);
  body.appendChild(iobar);
}

/* ── bank tab ── */
const BF = { term:"", bucket:"", sens:"", tier:"", sort:"rank" };
function paintBank(body){
  const bar = el("div","toolbar");
  const search = el("input","searchq-input"); search.type = "text"; search.placeholder = "Search questions…"; search.value = BF.term;
  search.oninput = () => { BF.term = search.value; paintRows(); };
  bar.appendChild(search);
  const mkSel = (opts, cur, fn, blankLabel) => {
    const s2 = el("select");
    const b = el("option",null,blankLabel); b.value = ""; s2.appendChild(b);
    opts.forEach(o => { const op = el("option",null,o); op.value = o; if (cur === o) op.selected = true; s2.appendChild(op); });
    s2.onchange = () => { fn(s2.value); paintRows(); };
    return s2;
  };
  bar.appendChild(mkSel(BUCKET_ORDER, BF.bucket, v => BF.bucket = v, "All buckets"));
  bar.appendChild(mkSel(["Low","Medium","High"], BF.sens, v => BF.sens = v, "Any sensitivity"));
  bar.appendChild(mkSel(["S / M / L","M / L","L"], BF.tier, v => BF.tier = v, "Any tier"));
  bar.appendChild(mkSel(["rank","priority","id"], BF.sort, v => BF.sort = v, "Sort: rank"));
  body.appendChild(bar);
  const countEl = el("div","fmeta");
  body.appendChild(countEl);

  const tbl = el("table","bank");
  tbl.innerHTML = "<thead><tr><th>ID</th><th>Question</th><th>Bucket</th><th>Input</th><th>Sens.</th><th>Pri</th><th>Rank</th><th>Tier</th><th></th></tr></thead>";
  const tbody = el("tbody");
  tbl.appendChild(tbody);
  body.appendChild(tbl);

  function paintRows(){
    tbody.innerHTML = "";
    let rows = DATA.bank.filter(b =>
      (!BF.term || (b.q + " " + (b.cat||"") + " " + b.id).toLowerCase().includes(BF.term.toLowerCase())) &&
      (!BF.bucket || b.bucket === BF.bucket) &&
      (!BF.sens || b.sens === BF.sens) &&
      (!BF.tier || b.tier === BF.tier)
    );
    rows = rows.slice().sort((a,b) =>
      BF.sort === "priority" ? (b.pri ?? -1) - (a.pri ?? -1) :
      BF.sort === "id" ? a.id.localeCompare(b.id) :
      (a.rank ?? 999) - (b.rank ?? 999)
    );
    countEl.textContent = `${rows.length} of ${DATA.bank.length} questions`;
    rows.forEach(b => {
      const tr = el("tr");
      const td = (n) => { const t = el("td"); t.appendChild(n); return t; };
      tr.appendChild(td(el("span","qid", b.id)));
      const qc = el("div","bcell-q", b.q);
      if (b.sub) qc.appendChild(el("div","fmeta", b.sub));
      tr.appendChild(td(qc));
      tr.appendChild(td(el("span","tag b" + Math.max(0, BUCKET_ORDER.indexOf(b.bucket)), (b.bucket||"").replace("Getting to Know You","Know You").replace("Money Mindset & Emotions","Mindset").replace("Goals, Values & Vision","Goals").replace("Financial Picture","Financial").replace("Preferences & Behavior","Prefs"))));
      tr.appendChild(td(el("span","fmeta", b.input || "")));
      tr.appendChild(td(el("span","tag s" + (b.sens||"L")[0], b.sens || "")));
      tr.appendChild(td(el("span","fmeta", b.pri != null ? String(b.pri) : "—")));
      tr.appendChild(td(el("span","fmeta", b.rank != null ? String(b.rank) : "—")));
      tr.appendChild(td(el("span","fmeta", b.tier || "—")));
      const act = el("div","cbtns");
      const pv = el("button","icon-btn","Preview");
      pv.onclick = () => { S.preview = { qid: b.id }; render(); Panel.close(); };
      const ad = el("button","icon-btn","+ Draft");
      ad.onclick = () => {
        if (S.draft.steps.some(s2 => s2.qid === b.id)){ toast(b.id + " already in draft"); return; }
        S.draft.steps.push({ qid: b.id }); toast(b.id + " added to draft (" + S.draft.steps.length + ")");
      };
      act.append(pv, ad);
      tr.appendChild(td(act));
      tbody.appendChild(tr);
    });
  }
  paintRows();

  // ── Fiduciary flow: topic-button chat questions ──────────────────────────────────────
  // These aren't standalone bank steps (they're option buttons on FID_MINDSET/FID_OBJECTIVES/
  // FID_NEXTSTEPS and FID_SUGGEST_TOPIC that emit a question into the chat sidebar — see
  // QUESTION_TEXT/emitToChatSidebar()), so they don't fit the Preview/+Draft table above.
  // Listed here read-only so every question the Fiduciary flow can hand off to chat stays
  // visible from the Question Bank tab, per request.
  body.appendChild(el("div","psec-title","Fiduciary flow — chat questions"));
  body.appendChild(el("div","fdesc",
    "Topic buttons on “What financial questions are you thinking about right now?”, “What are your biggest concerns?”, " +
    "“Where would you like to dive in first?”, and “What do you want to know?” — the actual text emitted into the chat sidebar's message box " +
    "when a hand-off page's button is used. (Mindset's buttons are answer-only and never emit; its three labels not shared with Objectives are listed for reference only.)"));
  const ftbl = el("table","bank");
  ftbl.innerHTML = "<thead><tr><th>Topic button</th><th>Page</th><th>Emitted question</th></tr></thead>";
  const ftbody = el("tbody");
  ftbl.appendChild(ftbody);
  Object.keys(QUESTION_TEXT).forEach(label => {
    const page = SUGGESTED_QUESTIONS.includes(label) ? "What do you want to know?" : "Mindset / Objectives / Next steps";
    const tr = el("tr");
    const td = (n) => { const t = el("td"); t.appendChild(n); return t; };
    tr.appendChild(td(el("span","fmeta", label)));
    tr.appendChild(td(el("span","fmeta", page)));
    tr.appendChild(td(el("div","bcell-q", QUESTION_TEXT[label])));
    ftbody.appendChild(tr);
  });
  body.appendChild(ftbl);
}

/* ── settings tab ── */
function paintSettings(body){
  body.appendChild(el("div","psec-title","Behavior"));
  const mk = (label, key, hint) => {
    const row = el("label","checkrow");
    const cb = el("input"); cb.type = "checkbox"; cb.checked = S.settings[key];
    cb.onchange = () => { S.settings[key] = cb.checked; render(); };
    row.append(cb, label);
    body.appendChild(row);
    if (hint) body.appendChild(el("div","fmeta", hint));
  };
  mk("Auto-advance after single-choice answers", "autoAdvance", "Multi-select, sliders and text always wait for Next.");
  mk("Debug mode — show ID, sensitivity, priority and input-type badges on each question", "debug");

  body.appendChild(el("div","psec-title","Session"));
  const bar = el("div","toolbar");
  const r1 = el("button","mini","Restart current flow");
  r1.onclick = () => { Engine.restart(); Panel.close(); };
  const r2 = el("button","mini warn","Clear all answers");
  r2.onclick = () => { S.answers = {}; Engine.start(S.flowKey); toast("Answers cleared"); Panel.paint(); };
  bar.append(r1, r2);
  body.appendChild(bar);

  body.appendChild(el("div","psec-title","About this prototype"));
  body.appendChild(el("div","fdesc",
    "Data: 123 questions from the “Full Question Bank” tab plus the 25 curated steps (with copy overrides) from “ShortMediumLong Flows” (S=7 ⊂ M=12 ⊂ L=25). " +
    "Flows are plain JSON — each step is {qid, showIf?}, so new flows and branching rules can be defined without touching the engine. " +
    "The Adaptive flow demonstrates conditional logic; the builder generates flows from Priority scores using the legend tab’s ordering principles."));
}

/* ═══════════════ KEYBOARD & BOOT ═══════════════ */
document.addEventListener("keydown", e => {
  if (Panel.open) { if (e.key === "Escape") Panel.close(); return; }
  const tag = (document.activeElement || {}).tagName;
  if (e.key === "Enter" && tag !== "TEXTAREA"){
    const btn = document.getElementById("nextBtn");
    // Click the real button (don't call Engine.next() directly) so Enter runs the same
    // per-step Next handlers as a click — Objectives' detour/jump, the chat/suggest-topic
    // emits, and Next-steps' stay-put all behave identically via keyboard.
    if (btn && !btn.disabled){ e.preventDefault(); btn.click(); }
  }
  if (e.key === "ArrowLeft" && tag !== "INPUT" && tag !== "TEXTAREA") Engine.back();
  if (e.key === "Escape" && S.preview){ S.preview = null; render(); }
});
// ── Mode toggles: wiring (segmented-control pattern per Component Template.html §"toggles") ──
// Testing-only — see the component-intent note near the top of this file. Each toggle sets a
// data-attribute on <html> (palette/theme) or window.LANG (language) and flips its own button's
// .on class; CSS variables + the @container/@media rules already in this file do the rest.
(function initModeToggles(){
  function wireSeg(id, attr, onPick){
    const seg = document.getElementById(id);
    if (!seg) return;
    seg.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;
      [].forEach.call(seg.querySelectorAll("button"), x => x.classList.toggle("on", x === b));
      onPick(b.getAttribute(attr));
    });
  }
  wireSeg("themeToggle", "data-set-theme", v => { document.documentElement.setAttribute("data-theme", v === "dark" ? "dark" : "light"); });
  wireSeg("langToggle", "data-set-lang", v => applyLang(v));
  document.documentElement.setAttribute("data-theme", "light");
})();
Engine.start("fiduciary");
applyLang("en");   // after Engine.start so the initial render() inside applyLang has a step to render
syncMainBottomPadding();
window.addEventListener("resize", () => {
  clearTimeout(window._mainPadT);
  window._mainPadT = setTimeout(syncMainBottomPadding, 120);   // #bottombar's wrap count can change with viewport width
});
</script>
