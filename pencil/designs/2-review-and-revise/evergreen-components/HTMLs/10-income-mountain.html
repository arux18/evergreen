<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Income mountain · design handoff</title>
<!--
EVERGREEN INTELLIGENCE · GEN UI COMPONENT HANDOFF
Component: Income mountain — retirement paycheck by age
Stacked area to the spending line; each source labeled in-plot at its own moment.
The verdict is the handoff story, not a number.
Register: private-bank / term-sheet. Verdict-first. Tabular numerals, hairline rules,
two font weights (400/500), serif for hero numbers only. Dark mode required.
DO NOT: gradients, shadows, decorative icons, extra color ramps, verdict below the evidence.

HEMLOCK ALIGNMENT (2026-08-26) — palette aligned to hemlock-library.lib.pen tokens:
the three stacked sources are CATEGORIES, not status — series paint comes from the categorical
palette in curated order (§7 rules 1–3): withdrawals → --cat1, Social Security → --cat2,
RMDs → --cat3 (status green/red stay reserved for pos/neg semantics) · in-plot label inks chosen
per fill and theme for contrast (#0E0E0E on cat1/cat2 both modes; white on cat3 light,
#0E0E0E on cat3 dark) · spending line --muted dashed · tick labels 11px --muted ·
fonts Heebo + Noto Serif · dark via html[data-theme="dark"] (Hemlock navy dark theme).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>

--neg:#C82320;--neg-strong:#C82320;--neg-soft:#F87171;

--table-head-bg:var(--accent-hover);--table-head-ink:var(--inverse);--table-total-bg:var(--seq1);
--font-sans:'Heebo',-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;--font-voice:'Noto Serif',Georgia,serif;}
html[data-theme="dark"]{
/* Hemlock navy dark theme (hemlock-library.lib.pen, Colors: Dark) — navy surfaces, navylight
   text ramp, navy border steps. Accents, status, and chart tokens are the Hemlock dark values. */

--border:#2A3A5C;--border-strong:#33476E;
--ink:#D8E1F0;--text-header:#D8E1F0;--text-body:#B3C1DB;--muted:#697DA0;--faint:#52637F;--inverse:#0E0E0E;
--heading:#7094FB;
--accent:#5A82F9;--accent-hover:#7094FB;--accent-subtle:#16304A;--accent-fill:rgba(90,130,249,0.15);
--pos:#4ADE80;--pos-mid:#74D791;--pos-strong:#4ADE80;
--neg:#F87171;--neg-strong:#FCA5A5;
--warn:#FB924D;--info:#38BDF8;--info-title:#38BDF8;
--pros-bg:#12291C;--pros-border:#245234;
--cons-bg:#3A1B1E;--cons-border:#542427;
--info-bg:#10263C;--info-border:#16304A;
--warn-bg:#33200F;--warn-border:#5E3A18;

body{font-family:var(--font-sans);color:var(--ink);background:var(--page-bg);max-width:680px;margin:3rem auto;padding:0 1.5rem;}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;}
td,th{padding:7px 0;text-align:right;font-weight:400;}
td:first-child,th:first-child{text-align:left;}
.kicker{font-size:14px;color:var(--muted);letter-spacing:.04em;margin-bottom:4px;display:flex;justify-content:space-between;align-items:baseline;}
.hero{display:flex;align-items:baseline;gap:16px;margin-bottom:1.25rem;}
.hero b{font-family:var(--font-voice);font-size:36px;font-weight:400;color:var(--ink);}
.hero span{font-size:14px;color:var(--text-body);}
.foot{font-size:12px;color:var(--faint);margin-top:.75rem;}
.card{background:var(--surface-2);border-radius:8px;padding:10px 14px;}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-body);}
text{font-family:var(--font-sans);}
.ml-wd{fill:#0E0E0E;}   /* on --cat1, both modes */
.ml-ss{fill:#0E0E0E;}   /* on --cat2, both modes */
.ml-rmd{fill:#FFFFFF;}  /* on --cat3 light (#312E81) */
html[data-theme="dark"] .ml-rmd{fill:#0E0E0E;}  /* on --cat3 dark (#8480D9) */
#themeToggle{position:fixed;top:12px;right:16px;font-size:11px;color:var(--faint);text-decoration:none;letter-spacing:.04em;}
</style>
<script>document.documentElement.dataset.theme='light';/* LIGHT is the shipping target — the app has no dark mode yet; dark is toggle-only, for design review */</script>
</head><body>
