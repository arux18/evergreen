<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat with Voice — Working Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Noto+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --panel-bg: #f7f5f0;
        --panel-border: #dcd8cb;
        --hover-bg: #edeae3;
        --pressed-bg: #e3dfd6;
        --text-primary: #2d2926;
        --text-secondary: #5e5954;
        --text-placeholder: #a8a49e;
        --blue: #3a6af8;
        --blue-soft: #7094fb;
        --blue-disabled: #c8d6fd;
        --input-border: #e8e6e0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #efece4;
        font-family: "Heebo", system-ui, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px 24px 32px;
        gap: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .caption {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #8a8680;
        text-transform: uppercase;
      }

      .state-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        background: #fff;
        border: 1px solid var(--input-border);
        border-radius: 999px;
        padding: 4px 14px;
        min-width: 150px;
        text-align: center;
      }

      .steps {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      .step-dot {
        appearance: none;
        border: 1px solid var(--panel-border);
        background: #fff;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 10px;
        line-height: 1;
        padding: 5px 9px;
        border-radius: 999px;
        cursor: pointer;
      }
      .step-dot:hover { background: var(--hover-bg); }
      .step-dot.active {
        background: var(--blue);
        border-color: var(--blue);
        color: #fff;
      }

      .btn-reset {
        appearance: none;
        border: 1px solid var(--panel-border);
        background: #fff;
        font-family: inherit;
        font-size: 11px;
        color: var(--text-secondary);
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .btn-reset:hover { background: var(--hover-bg); }

      /* ============ device ============ */

      .device-scaler { transform-origin: top center; }

      /* The exported PNGs are 444x928 logical px with the 360x844 panel
         inset 42px on every side (shadow bleed). All overlay coordinates
         below are panel-relative + 42. */
      .device {
        position: relative;
        width: 444px;
        height: 928px;
        user-select: none;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: 444px;
        height: 928px;
        background-size: 444px 928px;
        background-repeat: no-repeat;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .screen.visible {
        opacity: 1;
        pointer-events: auto;
      }

      .screen[data-state="welcome"]        { background-image: url("assets/welcome.png"); }
      .screen[data-state="promptSelected"] { background-image: url("assets/prompt-selected.png"); }
      .screen[data-state="conversation"]   { background-image: url("assets/conversation.png"); }
      .screen[data-state="recording"]      { background-image: url("assets/recording.png"); }
      .screen[data-state="transcribing"]   { background-image: url("assets/transcribing.png"); }
      .screen[data-state="transcribed"]    { background-image: url("assets/transcribed.png"); }
      .screen[data-state="thinking"]       { background-image: url("assets/thinking.png"); }
      .screen[data-state="answer"]         { background-image: url("assets/answer.png"); }

      .hotspot {
        position: absolute;
        appearance: none;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        border-radius: 999px;
        -webkit-tap-highlight-color: transparent;
      }
      .show-hotspots .hotspot {
        outline: 2px dashed rgba(58, 106, 248, 0.55);
        outline-offset: 2px;
        background: rgba(58, 106, 248, 0.08);
      }

      /* ============ welcome screen: live suggestion chip ============ */

      /* Covers the static chip baked into the PNG (panel bg patch).
         Baked chip: panel-relative (73,355) 215x42 -> overlay (115,397). */
      .chip-zone {
        position: absolute;
        left: 62px;   /* 42 + 20 */
        top: 391px;   /* 42 + 349 */
        width: 320px;
        height: 54px;
        background: var(--panel-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chip {
        position: relative;
        background: var(--panel-bg);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        padding: 12px 16px;
        cursor: pointer;
        overflow: hidden;
        min-height: 42px;
        width: max-content;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 150ms ease;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        font: inherit;
      }
      .chip:hover  { background: var(--hover-bg); }
      .chip:active { background: var(--pressed-bg); transition: background-color 0ms; }
      .chip:hover .chip-text,
      .chip:active .chip-text { color: var(--text-primary); }

      .chip-stack {
        display: grid;
        place-items: center;
        width: 100%;
      }

      .chip-text {
        grid-column: 1;
        grid-row: 1;
        font-family: "Heebo", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--text-secondary);
        text-align: center;
        white-space: nowrap;
        transform: translateY(60px);
        transition: transform 300ms ease-out, color 150ms ease;
        pointer-events: none;
      }
      .chip-text.is-current { transform: translateY(0); }
      .chip-text.is-leaving { transform: translateY(-60px); }

      /* ============ prompt-selected screen: chosen chip text ============ */

      /* Covers the baked input text (panel-relative (32,733) 296x21+). */
      .typed-line {
        position: absolute;
        left: 74px;   /* 42 + 32 */
        top: 773px;   /* 42 + 731 */
        width: 296px;
        height: 44px;
        background: #ffffff;
        display: none;
        font-size: 14px;
        line-height: 21px;
        color: var(--text-primary);
        overflow: hidden;
      }
      .typed-line.visible { display: block; }

      /* ============ recording screen: live waveform + timer ============ */

      /* Covers the baked dot/timer/waveform (panel-relative y ~726..760). */
      .rec-zone {
        position: absolute;
        left: 68px;   /* 42 + 26 */
        top: 770px;   /* 42 + 728 */
        width: 306px;
        height: 36px;
        background: #ffffff;
        display: flex;
        align-items: center;
      }

      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--blue);
        margin: 0 8px 0 6px;
        animation: rec-pulse 1.1s ease-in-out infinite;
      }
      @keyframes rec-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.78); }
      }

      .rec-timer {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        width: 36px;
        font-variant-numeric: tabular-nums;
      }

      .waveform {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 28px;
        flex: 1;
        overflow: hidden;
      }
      .waveform span {
        width: 3px;
        border-radius: 1.5px;
        background: var(--blue-soft);
        height: 6px;
        transition: height 120ms ease;
      }

      /* ============ transcribing screen: bouncing dots ============ */

      /* Covers the three baked dots (panel-relative (32,741..746) 5x5, 13px pitch). */
      .trans-zone {
        position: absolute;
        left: 70px;   /* 42 + 28 */
        top: 777px;   /* 42 + 735 */
        width: 46px;
        height: 18px;
        background: #ffffff;
        display: flex;
        align-items: center;
      }

      .trans-dots {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 4px;
      }
      .trans-dots span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--blue-soft);
        animation: dot-bounce 1.2s ease-in-out infinite;
      }
      .trans-dots span:nth-child(2) { animation-delay: 0.15s; }
      .trans-dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes dot-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
        30%           { transform: translateY(-4px); opacity: 1; }
      }

      /* ============ thinking screen: dots + shimmer status ============ */

      /* Covers baked dots row (panel-rel (20,631) 36x8) and status
         text (panel-rel (20,651) 320x42). */
      .think-zone {
        position: absolute;
        left: 62px;   /* 42 + 20 */
        top: 665px;   /* 42 + 623 */
        width: 320px;
        height: 72px;
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
      }

      .think-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 20px;
      }
      .think-dots span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--text-placeholder);
        animation: dot-bounce 1.2s ease-in-out infinite;
      }
      .think-dots span:nth-child(2) { animation-delay: 0.15s; }
      .think-dots span:nth-child(3) { animation-delay: 0.3s; }

      .think-status {
        font-size: 14px;
        line-height: 21px;
        background: linear-gradient(
          90deg,
          #a8a49e 0%,
          #5e5954 30%,
          #a8a49e 60%,
          #5e5954 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2.2s linear infinite;
      }
      @keyframes shimmer {
        from { background-position: 200% 0; }
        to   { background-position: 0% 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .chip-text, .waveform span { transition: none; }
        .rec-dot, .trans-dots span, .think-dots span, .think-status { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="toolbar">
        <div class="caption">Chat with voice · working prototype</div>
        <div class="state-label" id="stateLabel">Welcome</div>
        <div class="steps" id="steps"></div>
        <button class="btn-reset" id="resetBtn" type="button">Reset</button>
        <button class="btn-reset" id="hotspotBtn" type="button">Show hotspots</button>
      </div>

      <div class="device-scaler" id="scaler">
        <div class="device" id="device">
          <!-- 1. WELCOME — animated suggestion chip -->
          <section class="screen" data-state="welcome">
            <div class="chip-zone">
              <button type="button" class="chip" id="suggestionChip" aria-live="polite" aria-label="Suggested question">
                <span class="chip-stack" id="chipStack"></span>
              </button>
            </div>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>

          <!-- 2. PROMPT SELECTED — chip question sits in the input, send armed -->
          <section class="screen" data-state="promptSelected">
            <div class="typed-line" id="typedLine"></div>
            <button class="hotspot" data-action="send-first" title="Send"
              style="left:336px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>

          <!-- 3. CONVERSATION — first answer delivered, input idle -->
          <section class="screen" data-state="conversation">
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>

          <!-- 4. RECORDING — live waveform + timer -->
          <section class="screen" data-state="recording">
            <div class="rec-zone">
              <div class="rec-dot"></div>
              <div class="rec-timer" id="recTimer">0:00</div>
              <div class="waveform" id="waveform"></div>
            </div>
            <button class="hotspot" data-action="stop-recording" title="Stop recording"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>

          <!-- 5. TRANSCRIBING (auto-advances) -->
          <section class="screen" data-state="transcribing">
            <div class="trans-zone">
              <div class="trans-dots"><span></span><span></span><span></span></div>
            </div>
          </section>

          <!-- 6. TRANSCRIBED — voice question in the input, send armed -->
          <section class="screen" data-state="transcribed">
            <button class="hotspot" data-action="send-second" title="Send"
              style="left:336px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>

          <!-- 7. THINKING (auto-advances) -->
          <section class="screen" data-state="thinking">
            <div class="think-zone">
              <div class="think-dots"><span></span><span></span><span></span></div>
              <div class="think-status">Checking your transaction history and spending patterns...</div>
            </div>
          </section>

          <!-- 8. ANSWER -->
          <section class="screen" data-state="answer">
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:294px; top:820px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="restart" title="Close panel (restarts demo)"
              style="left:354px; top:58px; width:32px; height:32px;"></button>
          </section>
        </div>
      </div>

      <p class="caption" style="max-width: 480px; text-align: center; text-transform: none; letter-spacing: 0;">
        Tap the cycling chip to select a prompt, send it, then use the mic:
        recording &rarr; transcribing &rarr; transcribed question &rarr; thinking &rarr; answer.
        Arrow keys step through; the top-right FAB restarts.
      </p>
    </main>

    <script>
      /* ---------- state machine ---------- */

      const SEQUENCE = [
        ["welcome", "Welcome"],
        ["promptSelected", "Prompt Selected"],
        ["conversation", "Conversation"],
        ["recording", "Recording"],
        ["transcribing", "Transcribing"],
        ["transcribed", "Voice Transcribed"],
        ["thinking", "Thinking"],
        ["answer", "Answer"],
      ];
      const LABELS = Object.fromEntries(SEQUENCE);

      const device = document.getElementById("device");
      const stateLabel = document.getElementById("stateLabel");
      const stepsEl = document.getElementById("steps");
      const typedLine = document.getElementById("typedLine");

      let state = null;
      let autoTimer = null;

      SEQUENCE.forEach(([key], i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "step-dot";
        b.textContent = i + 1;
        b.title = LABELS[key];
        b.addEventListener("click", () => go(key));
        stepsEl.appendChild(b);
      });

      function go(next) {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
        stopRecordingAnim();
        state = next;

        device.querySelectorAll(".screen").forEach((s) => {
          s.classList.toggle("visible", s.dataset.state === next);
        });
        stateLabel.textContent = LABELS[next];
        [...stepsEl.children].forEach((b, i) => {
          b.classList.toggle("active", SEQUENCE[i][0] === next);
        });

        if (next === "welcome") resetWelcome();
        else chipStop();
        if (next !== "promptSelected") typedLine.classList.remove("visible");
        if (next === "recording") startRecordingAnim();
        if (next === "transcribing") {
          autoTimer = setTimeout(() => go("transcribed"), 2400);
        }
        if (next === "thinking") {
          autoTimer = setTimeout(() => go("answer"), 3000);
        }
      }

      device.addEventListener("click", (e) => {
        const hs = e.target.closest(".hotspot");
        if (!hs) return;
        const action = hs.dataset.action;
        if (action === "voice") go("recording");
        if (action === "stop-recording") go("transcribing");
        if (action === "send-first") go("conversation");
        if (action === "send-second") go("thinking");
        if (action === "restart") go("welcome");
      });

      document.addEventListener("keydown", (e) => {
        const idx = SEQUENCE.findIndex(([k]) => k === state);
        if (e.key === "ArrowRight") go(SEQUENCE[(idx + 1) % SEQUENCE.length][0]);
        if (e.key === "ArrowLeft") go(SEQUENCE[(idx - 1 + SEQUENCE.length) % SEQUENCE.length][0]);
      });

      document.getElementById("resetBtn").addEventListener("click", () => go("welcome"));
      document.getElementById("hotspotBtn").addEventListener("click", function () {
        const on = device.parentElement.classList.toggle("show-hotspots");
        this.textContent = on ? "Hide hotspots" : "Show hotspots";
      });

      /* ---------- suggestion chip rolodex (from suggestion-chip-prototype) ---------- */

      const SUGGESTIONS = [
        "What's a donor-advised fund?",
        "How am I tracking against my savings goal?",
        "How much should I save for retirement?",
        "Explain the wash-sale rule",
        "What's a safe withdrawal rate?",
        "Should I do a Roth conversion?",
      ];
      const CYCLE_MS = 3000;
      const TRANSITION_MS = 300;

      const stack = document.getElementById("chipStack");
      const chip = document.getElementById("suggestionChip");

      const layerA = document.createElement("span");
      const layerB = document.createElement("span");
      layerA.className = "chip-text is-current";
      layerB.className = "chip-text";
      layerA.textContent = SUGGESTIONS[0];
      stack.appendChild(layerA);
      stack.appendChild(layerB);

      let index = 0;
      let current = layerA;
      let next = layerB;
      let chipTimer = null;
      let chipPaused = false;

      function rotate() {
        if (chipPaused) return;
        index = (index + 1) % SUGGESTIONS.length;

        next.style.transition = "none";
        next.classList.remove("is-current", "is-leaving");
        next.textContent = SUGGESTIONS[index];
        next.offsetHeight; // reflow so the reset lands before re-enabling
        next.style.transition = "";

        current.classList.add("is-leaving");
        next.classList.add("is-current");

        const justLeft = current;
        current = next;
        next = justLeft;

        setTimeout(() => {
          if (justLeft.classList.contains("is-leaving")) justLeft.textContent = "";
        }, TRANSITION_MS);
      }

      function chipStart() { chipStop(); chipTimer = setInterval(rotate, CYCLE_MS); }
      function chipStop() { if (chipTimer !== null) { clearInterval(chipTimer); chipTimer = null; } }

      chip.addEventListener("click", () => {
        typedLine.textContent = SUGGESTIONS[index];
        typedLine.classList.add("visible");
        go("promptSelected");
      });
      chip.addEventListener("mouseenter", () => { chipPaused = true; chipStop(); });
      chip.addEventListener("mouseleave", () => {
        if (state === "welcome") { chipPaused = false; chipStart(); }
      });

      function resetWelcome() {
        chipPaused = false;
        chipStart();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) chipStop();
        else if (state === "welcome" && !chipPaused) chipStart();
      });

      /* ---------- recording waveform + timer ---------- */

      const waveformEl = document.getElementById("waveform");
      const recTimerEl = document.getElementById("recTimer");
      const BAR_COUNT = 49; // ~246px track / 5px pitch
      let waveTimer = null;
      let recStart = 0;
      let recTick = null;

      for (let i = 0; i < BAR_COUNT; i++) {
        waveformEl.appendChild(document.createElement("span"));
      }
      const bars = [...waveformEl.children];

      function randomHeights() {
        bars.forEach((b) => {
          const h = 4 + Math.round(Math.random() * 24);
          b.style.height = h + "px";
        });
      }

      function startRecordingAnim() {
        randomHeights();
        waveTimer = setInterval(randomHeights, 140);
        recStart = Date.now();
        recTimerEl.textContent = "0:00";
        recTick = setInterval(() => {
          const s = Math.floor((Date.now() - recStart) / 1000);
          recTimerEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        }, 250);
      }

      function stopRecordingAnim() {
        if (waveTimer) { clearInterval(waveTimer); waveTimer = null; }
        if (recTick) { clearInterval(recTick); recTick = null; }
      }

      /* ---------- fit to viewport ---------- */

      const scaler = document.getElementById("scaler");
      function fit() {
        const available = window.innerHeight - 140;
        const s = Math.min(1, available / 928);
        scaler.style.transform = "scale(" + s + ")";
        scaler.style.marginBottom = (928 * (s - 1)) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      /* ---------- boot ---------- */
      const initial = location.hash.slice(1);
      go(LABELS[initial] ? initial : "welcome");
    </script>
  </body>
</html>
