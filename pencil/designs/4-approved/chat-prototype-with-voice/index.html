<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chat Prototype with Voice — Working Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Noto+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --panel-bg: #ffffff;
        --bar-bg: #f7f5f0;
        --chip-bg: #f7f5f0;
        --chip-border: #dcd8cb;
        --hover-bg: #edeae3;
        --pressed-bg: #e3dfd6;
        --text-primary: #2d2926;
        --text-secondary: #5e5954;
        --text-placeholder: #a8a49e;
        --blue: #3a6af8;
        --blue-soft: #7094fb;
        --input-border: #e8e6e0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #efece4;
        font-family: "Heebo", system-ui, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20px 24px 32px;
        gap: 12px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .caption {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #8a8680;
        text-transform: uppercase;
      }

      .state-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-primary);
        background: #fff;
        border: 1px solid var(--input-border);
        border-radius: 999px;
        padding: 4px 14px;
        min-width: 150px;
        text-align: center;
      }

      .steps { display: flex; gap: 6px; align-items: center; }

      .step-dot {
        appearance: none;
        border: 1px solid var(--chip-border);
        background: #fff;
        color: var(--text-secondary);
        font-family: inherit;
        font-size: 10px;
        line-height: 1;
        padding: 5px 9px;
        border-radius: 999px;
        cursor: pointer;
      }
      .step-dot:hover { background: var(--hover-bg); }
      .step-dot.active { background: var(--blue); border-color: var(--blue); color: #fff; }

      .btn-reset {
        appearance: none;
        border: 1px solid var(--chip-border);
        background: #fff;
        font-family: inherit;
        font-size: 11px;
        color: var(--text-secondary);
        padding: 5px 12px;
        border-radius: 999px;
        cursor: pointer;
      }
      .btn-reset:hover { background: var(--hover-bg); }

      /* ============ device ============ */

      .device-scaler { transform-origin: top center; }

      /* PNGs are 444x928 logical px; the 360x844 panel is inset 42px on every
         side (shadow bleed). Overlay coordinates = panel-relative + 42. */
      .device {
        position: relative;
        width: 444px;
        height: 928px;
        user-select: none;
      }

      .screen {
        position: absolute;
        inset: 0;
        width: 444px;
        height: 928px;
        background-size: 444px 928px;
        background-repeat: no-repeat;
        opacity: 0;
        pointer-events: none;
        transition: opacity 180ms ease;
      }
      .screen.visible { opacity: 1; pointer-events: auto; }

      .screen[data-state="welcome"]        { background-image: url("assets/welcome.png"); }
      .screen[data-state="promptSelected"] { background-image: url("assets/prompt-selected.png"); }
      .screen[data-state="typingExpanded"] { background-image: url("assets/typing-expanded.png"); }
      .screen[data-state="conversation"]   { background-image: url("assets/conversation.png"); }
      .screen[data-state="thinking"]       { background-image: url("assets/thinking.png"); }
      .screen[data-state="recording"]      { background-image: url("assets/recording.png"); }
      .screen[data-state="transcribing"]   { background-image: url("assets/transcribing.png"); }

      .hotspot {
        position: absolute;
        appearance: none;
        border: none;
        background: transparent;
        padding: 0;
        cursor: pointer;
        border-radius: 999px;
        -webkit-tap-highlight-color: transparent;
      }
      .show-hotspots .hotspot {
        outline: 2px dashed rgba(58, 106, 248, 0.55);
        outline-offset: 2px;
        background: rgba(58, 106, 248, 0.08);
      }

      /* ============ welcome: live suggestion chip ============ */

      .chip-zone {
        position: absolute;
        left: 62px;   /* 42 + 20 */
        top: 422px;   /* 42 + 380 */
        width: 320px;
        height: 56px;
        background: var(--panel-bg);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .chip {
        position: relative;
        background: var(--chip-bg);
        border: 1px solid var(--chip-border);
        border-radius: 24px;
        padding: 12px 16px;
        cursor: pointer;
        overflow: hidden;
        min-height: 42px;
        width: max-content;
        max-width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 150ms ease;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        font: inherit;
      }
      .chip:hover  { background: var(--hover-bg); }
      .chip:active { background: var(--pressed-bg); transition: background-color 0ms; }
      .chip:hover .chip-text,
      .chip:active .chip-text { color: var(--text-primary); }

      .chip-stack { display: grid; place-items: center; width: 100%; }

      .chip-text {
        grid-column: 1;
        grid-row: 1;
        font-family: "Heebo", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.3;
        color: var(--text-secondary);
        text-align: center;
        white-space: nowrap;
        transform: translateY(60px);
        transition: transform 300ms ease-out, color 150ms ease;
        pointer-events: none;
      }
      .chip-text.is-current { transform: translateY(0); }
      .chip-text.is-leaving { transform: translateY(-60px); }

      /* ============ prompt selected: chosen question overlay ============ */

      .chosen-line {
        position: absolute;
        left: 58px;   /* 42 + 16 */
        top: 835px;   /* 42 + 793 */
        width: 244px;
        height: 28px;
        background: var(--bar-bg);
        display: none;
        align-items: center;
        font-size: 16px;
        color: var(--text-primary);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .chosen-line.visible { display: flex; }

      /* ============ recording: live waveform ============ */

      .rec-zone {
        position: absolute;
        left: 56px;   /* 42 + 14 */
        top: 830px;   /* 42 + 788 */
        width: 252px;
        height: 38px;
        background: var(--bar-bg);
        display: flex;
        align-items: center;
      }

      .rec-dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--blue);
        margin: 0 8px 0 2px;
        animation: rec-pulse 1.1s ease-in-out infinite;
      }
      @keyframes rec-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.35; transform: scale(0.78); }
      }

      .rec-timer {
        font-size: 13px;
        font-weight: 500;
        color: var(--text-secondary);
        width: 34px;
        font-variant-numeric: tabular-nums;
      }

      .waveform {
        display: flex;
        align-items: center;
        gap: 2px;
        height: 28px;
        width: 194px;
        overflow: hidden;
      }
      .waveform span {
        width: 3px;
        border-radius: 1.5px;
        background: var(--blue-soft);
        height: 6px;
        transition: height 120ms ease;
      }

      /* ============ transcribing: bouncing dots ============ */

      .trans-zone {
        position: absolute;
        left: 56px;   /* 42 + 14 */
        top: 830px;   /* 42 + 788 */
        width: 252px;
        height: 38px;
        background: var(--bar-bg);
        display: flex;
        align-items: center;
      }

      .trans-dots {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 13px 0 2px;
      }
      .trans-dots span {
        width: 5px;
        height: 5px;
        border-radius: 999px;
        background: var(--blue-soft);
        animation: dot-bounce 1.2s ease-in-out infinite;
      }
      .trans-dots span:nth-child(2) { animation-delay: 0.15s; }
      .trans-dots span:nth-child(3) { animation-delay: 0.3s; }

      .trans-label {
        font-size: 16px;
        color: var(--text-placeholder);
      }

      @keyframes dot-bounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.55; }
        30%           { transform: translateY(-4px); opacity: 1; }
      }

      /* ============ thinking: dots + shimmer status ============ */

      .think-zone {
        position: absolute;
        left: 62px;   /* 42 + 20 */
        top: 735px;   /* 42 + 693 */
        width: 320px;
        height: 57px;
        background: var(--panel-bg);
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
      }

      .think-dots {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 24px;
      }
      .think-dots span {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--text-placeholder);
        animation: dot-bounce 1.2s ease-in-out infinite;
      }
      .think-dots span:nth-child(2) { animation-delay: 0.15s; }
      .think-dots span:nth-child(3) { animation-delay: 0.3s; }

      .think-status {
        font-size: 14px;
        line-height: 21px;
        background: linear-gradient(
          90deg,
          #a8a49e 0%,
          #5e5954 30%,
          #a8a49e 60%,
          #5e5954 100%
        );
        background-size: 200% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 2.2s linear infinite;
      }
      @keyframes shimmer {
        from { background-position: 200% 0; }
        to   { background-position: 0% 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .chip-text, .waveform span { transition: none; }
        .rec-dot, .trans-dots span, .think-dots span, .think-status { animation: none; }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="toolbar">
        <div class="caption">Chat prototype with voice</div>
        <div class="state-label" id="stateLabel">Welcome</div>
        <div class="steps" id="steps"></div>
        <button class="btn-reset" id="resetBtn" type="button">Reset</button>
        <button class="btn-reset" id="hotspotBtn" type="button">Show hotspots</button>
      </div>

      <div class="device-scaler" id="scaler">
        <div class="device" id="device">
          <!-- WELCOME -->
          <section class="screen" data-state="welcome">
            <div class="chip-zone">
              <button type="button" class="chip" id="suggestionChip" aria-live="polite" aria-label="Suggested question">
                <span class="chip-stack" id="chipStack"></span>
              </button>
            </div>
            <button class="hotspot" data-action="expand" title="Tap input to type"
              style="left:42px; top:812px; width:260px; height:74px; border-radius:12px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:310px; top:832px; width:34px; height:34px;"></button>
          </section>

          <!-- PROMPT SELECTED -->
          <section class="screen" data-state="promptSelected">
            <div class="chosen-line" id="chosenLine"></div>
            <button class="hotspot" data-action="expand" title="Tap input to type"
              style="left:42px; top:812px; width:260px; height:74px; border-radius:12px;"></button>
            <button class="hotspot" data-action="send" title="Send"
              style="left:352px; top:832px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:310px; top:832px; width:34px; height:34px;"></button>
          </section>

          <!-- TYPING EXPANDED -->
          <section class="screen" data-state="typingExpanded">
            <button class="hotspot" data-action="send" title="Send"
              style="left:352px; top:832px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:310px; top:832px; width:34px; height:34px;"></button>
          </section>

          <!-- CONVERSATION -->
          <section class="screen" data-state="conversation">
            <button class="hotspot" data-action="expand" title="Tap input to type"
              style="left:42px; top:798px; width:260px; height:88px; border-radius:12px;"></button>
            <button class="hotspot" data-action="send" title="Send"
              style="left:352px; top:825px; width:34px; height:34px;"></button>
            <button class="hotspot" data-action="voice" title="Start voice input"
              style="left:310px; top:825px; width:34px; height:34px;"></button>
          </section>

          <!-- THINKING (auto-advances) -->
          <section class="screen" data-state="thinking">
            <div class="think-zone">
              <div class="think-dots"><span></span><span></span><span></span></div>
              <div class="think-status">Generating your retirement projection...</div>
            </div>
          </section>

          <!-- RECORDING -->
          <section class="screen" data-state="recording">
            <div class="rec-zone">
              <div class="rec-dot"></div>
              <div class="rec-timer" id="recTimer">0:00</div>
              <div class="waveform" id="waveform"></div>
            </div>
            <button class="hotspot" data-action="stop-recording" title="Stop recording"
              style="left:310px; top:832px; width:34px; height:34px;"></button>
          </section>

          <!-- TRANSCRIBING (auto-advances) -->
          <section class="screen" data-state="transcribing">
            <div class="trans-zone">
              <div class="trans-dots"><span></span><span></span><span></span></div>
              <div class="trans-label">Transcribing...</div>
            </div>
          </section>
        </div>
      </div>

      <p class="caption" style="max-width: 460px; text-align: center; text-transform: none; letter-spacing: 0;">
        Tap the chip to select a prompt, the input to expand it, send to watch
        thinking resolve, and the mic for voice recording &rarr; transcription.
        Arrow keys step through the sequence.
      </p>
    </main>

    <script>
      /* ---------- state machine ---------- */

      const SEQUENCE = [
        ["welcome", "Welcome"],
        ["promptSelected", "Prompt Selected"],
        ["typingExpanded", "Typing Expanded"],
        ["conversation", "Conversation"],
        ["thinking", "Conversation + Thinking"],
        ["recording", "Recording"],
        ["transcribing", "Transcribing"],
      ];
      const LABELS = Object.fromEntries(SEQUENCE);

      const device = document.getElementById("device");
      const stateLabel = document.getElementById("stateLabel");
      const stepsEl = document.getElementById("steps");
      const chosenLine = document.getElementById("chosenLine");

      let state = null;
      let autoTimer = null;

      SEQUENCE.forEach(([key], i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "step-dot";
        b.textContent = i + 1;
        b.title = LABELS[key];
        b.addEventListener("click", () => go(key));
        stepsEl.appendChild(b);
      });

      function go(next) {
        if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
        stopRecordingAnim();
        state = next;

        device.querySelectorAll(".screen").forEach((s) => {
          s.classList.toggle("visible", s.dataset.state === next);
        });
        stateLabel.textContent = LABELS[next];
        [...stepsEl.children].forEach((b, i) => {
          b.classList.toggle("active", SEQUENCE[i][0] === next);
        });

        if (next === "welcome") resetWelcome();
        if (next !== "promptSelected") chosenLine.classList.remove("visible");
        if (next === "recording") startRecordingAnim();
        if (next === "thinking") autoTimer = setTimeout(() => go("conversation"), 3000);
        if (next === "transcribing") autoTimer = setTimeout(() => go("conversation"), 2400);
      }

      device.addEventListener("click", (e) => {
        const hs = e.target.closest(".hotspot");
        if (!hs) return;
        const action = hs.dataset.action;
        if (action === "voice") go("recording");
        if (action === "stop-recording") go("transcribing");
        if (action === "send") go("thinking");
        if (action === "expand") go("typingExpanded");
      });

      document.addEventListener("keydown", (e) => {
        const idx = SEQUENCE.findIndex(([k]) => k === state);
        if (e.key === "ArrowRight") go(SEQUENCE[(idx + 1) % SEQUENCE.length][0]);
        if (e.key === "ArrowLeft") go(SEQUENCE[(idx - 1 + SEQUENCE.length) % SEQUENCE.length][0]);
      });

      document.getElementById("resetBtn").addEventListener("click", () => go("welcome"));
      document.getElementById("hotspotBtn").addEventListener("click", function () {
        const on = device.parentElement.classList.toggle("show-hotspots");
        this.textContent = on ? "Hide hotspots" : "Show hotspots";
      });

      /* ---------- suggestion chip rolodex (from suggestion-chip-prototype) ---------- */

      const SUGGESTIONS = [
        "What's a donor-advised fund?",
        "What is a Roth IRA?",
        "How much should I save for retirement?",
        "Explain the wash-sale rule",
        "What's a safe withdrawal rate?",
        "Should I do a Roth conversion?",
      ];
      const CYCLE_MS = 3000;
      const TRANSITION_MS = 300;

      const stack = document.getElementById("chipStack");
      const chip = document.getElementById("suggestionChip");

      const layerA = document.createElement("span");
      const layerB = document.createElement("span");
      layerA.className = "chip-text is-current";
      layerB.className = "chip-text";
      layerA.textContent = SUGGESTIONS[0];
      stack.appendChild(layerA);
      stack.appendChild(layerB);

      let index = 0;
      let current = layerA;
      let next = layerB;
      let chipTimer = null;
      let chipPaused = false;

      function rotate() {
        if (chipPaused) return;
        index = (index + 1) % SUGGESTIONS.length;

        next.style.transition = "none";
        next.classList.remove("is-current", "is-leaving");
        next.textContent = SUGGESTIONS[index];
        next.offsetHeight; // reflow so the reset lands before re-enabling
        next.style.transition = "";

        current.classList.add("is-leaving");
        next.classList.add("is-current");

        const justLeft = current;
        current = next;
        next = justLeft;

        setTimeout(() => {
          if (justLeft.classList.contains("is-leaving")) justLeft.textContent = "";
        }, TRANSITION_MS);
      }

      function chipStart() { chipStop(); chipTimer = setInterval(rotate, CYCLE_MS); }
      function chipStop() { if (chipTimer !== null) { clearInterval(chipTimer); chipTimer = null; } }

      chip.addEventListener("click", () => {
        chosenLine.textContent = SUGGESTIONS[index];
        chosenLine.classList.add("visible");
        chipStop();
        go("promptSelected");
      });
      chip.addEventListener("mouseenter", () => { chipPaused = true; chipStop(); });
      chip.addEventListener("mouseleave", () => {
        if (state === "welcome") { chipPaused = false; chipStart(); }
      });

      function resetWelcome() {
        chipPaused = false;
        chipStart();
      }

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) chipStop();
        else if (state === "welcome" && !chipPaused) chipStart();
      });

      /* ---------- recording waveform + timer ---------- */

      const waveformEl = document.getElementById("waveform");
      const recTimerEl = document.getElementById("recTimer");
      const BAR_COUNT = 39; // 194px track / 5px pitch
      let waveTimer = null;
      let recStart = 0;
      let recTick = null;

      for (let i = 0; i < BAR_COUNT; i++) {
        waveformEl.appendChild(document.createElement("span"));
      }
      const bars = [...waveformEl.children];

      function randomHeights() {
        bars.forEach((b) => {
          const h = 4 + Math.round(Math.random() * 24);
          b.style.height = h + "px";
        });
      }

      function startRecordingAnim() {
        randomHeights();
        waveTimer = setInterval(randomHeights, 140);
        recStart = Date.now();
        recTimerEl.textContent = "0:00";
        recTick = setInterval(() => {
          const s = Math.floor((Date.now() - recStart) / 1000);
          recTimerEl.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        }, 250);
      }

      function stopRecordingAnim() {
        if (waveTimer) { clearInterval(waveTimer); waveTimer = null; }
        if (recTick) { clearInterval(recTick); recTick = null; }
      }

      /* ---------- fit to viewport ---------- */

      const scaler = document.getElementById("scaler");
      function fit() {
        const available = window.innerHeight - 140;
        const s = Math.min(1, available / 928);
        scaler.style.transform = "scale(" + s + ")";
        scaler.style.marginBottom = (928 * (s - 1)) + "px";
      }
      window.addEventListener("resize", fit);
      fit();

      /* ---------- boot ---------- */
      const initial = location.hash.slice(1);
      go(LABELS[initial] ? initial : "welcome");
    </script>
  </body>
</html>
