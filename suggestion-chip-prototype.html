<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Suggestion Chip Animation — cp1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Noto+Serif:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --nav-bg: #f7f5f0;
        --nav-border: #dcd8cb;
        --nav-divider: #e8e6e0;
        --nav-hover-bg: #edeae3;
        --text-primary: #2d2926;
        --text-secondary: #5e5954;
        --text-placeholder: #a8a49e;
        --shadow: #2d292628;
        --input-bg: #fefefe;
        --input-border: #e8e6e0;
        --send-bg: #3c3c3c;
        --send-icon: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #efece4;
        font-family: "Geist", system-ui, sans-serif;
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }

      .stage {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 48px 24px;
        gap: 32px;
        grid-template-columns: 1fr;
      }

      .caption {
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.5px;
        color: #8a8680;
        text-transform: uppercase;
        text-align: center;
      }

      /* cp1 frame: 360 x 600, F7F5F0, stroke DCD8CB 1px inside, radius 12, shadow blur 28 y:2 */
      .cp1 {
        width: 360px;
        height: 600px;
        background: var(--nav-bg);
        border: 1px solid var(--nav-border);
        border-radius: 12px;
        box-shadow: 0 2px 28px 2px var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      /* header — sketched to fit the aesthetic */
      .chat-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 20px;
        border-bottom: 1px solid var(--nav-divider);
      }

      .chat-header .title {
        font-family: "Noto Serif", Georgia, serif;
        font-size: 16px;
        font-weight: 500;
        color: var(--text-primary);
      }

      .icon-btn {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border-radius: 6px;
        color: var(--text-secondary);
        cursor: pointer;
      }
      .icon-btn:hover {
        background: var(--nav-hover-bg);
      }

      /* messages area: vertical, center, padding 16/20, gap 14 */
      .chat-messages {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 16px 20px;
      }

      .greeting {
        font-family: "Noto Serif", Georgia, serif;
        font-size: 20px;
        font-weight: 400;
        color: var(--text-primary);
        text-align: center;
      }

      .chips {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: stretch;
        width: 100%;
      }

      /* L5bc2 — Chat / Suggestion Chip
         Default: radius 24, fill nav.bg, border nav.border, padding 12/16,
                  Geist 14 center, color text.secondary
         Hover (KiEZx → OEGjn): bg #EDEAE3, text primary, transition bg 150ms ease
         Pressed (rxPoy → s7g9un): bg #E3DFD6, text primary,
                  sends current question to chat input */
      .chip {
        position: relative;
        background: var(--nav-bg);
        border: 1px solid var(--nav-border);
        border-radius: 24px;
        padding: 12px 16px;
        cursor: pointer;
        overflow: hidden;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background-color 150ms ease;
        -webkit-tap-highlight-color: transparent;
        appearance: none;
        font: inherit;
      }

      .chip:hover {
        background: var(--nav-hover-bg);
      }

      .chip:active {
        background: #e3dfd6;
        transition: background-color 0ms;
      }

      /* Hover/pressed swap the chip text to primary color */
      .chip:hover .chip-text,
      .chip:active .chip-text {
        color: var(--text-primary);
      }

      /* The two-layer text crossfade with slide-up.
         Each .chip-text occupies the same cell so they overlap. */
      .chip-stack {
        display: grid;
        place-items: center;
        width: 100%;
      }

      .chip-text {
        grid-column: 1;
        grid-row: 1;
        font-family: "Geist", system-ui, sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.25;
        color: var(--text-secondary);
        text-align: center;
        opacity: 0;
        transform: translateY(8px);
        transition:
          opacity 300ms ease-out,
          transform 300ms ease-out,
          color 150ms ease;
        pointer-events: none;
      }

      .chip-text.is-current {
        opacity: 1;
        transform: translateY(0);
      }

      .chip-text.is-leaving {
        opacity: 0;
        transform: translateY(-8px);
      }

      /* input — sketched to fit the aesthetic */
      .chat-input {
        margin: 12px;
        padding: 12px;
        background: var(--input-bg);
        border: 1px solid var(--input-border);
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .chat-input {
        transition: border-color 150ms ease;
      }

      .chat-input.is-active {
        border-color: #c0bab2;
      }

      .input-text {
        font-size: 14px;
        color: var(--text-placeholder);
        padding: 4px 4px 0;
        font-family: "Geist", system-ui, sans-serif;
        line-height: 1.35;
        min-height: 20px;
      }

      .input-text[data-empty="false"] {
        color: var(--text-primary);
      }

      .input-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .input-actions .left,
      .input-actions .right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .send-btn {
        width: 34px;
        height: 34px;
        background: var(--send-bg);
        color: var(--send-icon);
        border-radius: 9999px;
        display: grid;
        place-items: center;
        cursor: pointer;
      }

      .send-btn[disabled] {
        background: #d4d1ca;
      }

      .icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .icon-sm {
        width: 14px;
        height: 14px;
      }

      /* status pill below the device for transparency */
      .meta {
        font-family: "Geist", system-ui, sans-serif;
        font-size: 11px;
        color: #8a8680;
        text-align: center;
        max-width: 360px;
        line-height: 1.5;
      }

      .meta strong {
        color: var(--text-primary);
        font-weight: 600;
      }

      @media (prefers-reduced-motion: reduce) {
        .chip-text {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <div class="caption">cp1 · suggestion chip animation</div>

      <section class="cp1" aria-label="Home dashboard concept cp1">
        <header class="chat-header">
          <div class="title">Ask Evergreen</div>
          <div class="icon-btn" aria-label="New chat">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
          </div>
        </header>

        <div class="chat-messages">
          <div class="greeting">Ask me any financial question...</div>

          <div class="chips">
            <button
              type="button"
              class="chip"
              id="suggestionChip"
              aria-live="polite"
              aria-label="Suggested question"
            >
              <span class="chip-stack" id="chipStack">
                <!-- chip-text nodes inserted by JS -->
              </span>
            </button>
          </div>
        </div>

        <div class="chat-input">
          <div class="input-text" id="inputText" data-empty="true">Message Evergreen…</div>
          <div class="input-actions">
            <div class="left">
              <div class="icon-btn" aria-label="Attach">
                <svg class="icon" viewBox="0 0 24 24">
                  <path d="M21 11.5l-8.5 8.5a5 5 0 01-7-7L14 4.5a3.5 3.5 0 015 5L10.5 18a2 2 0 01-3-3l7-7" />
                </svg>
              </div>
              <div class="icon-btn" aria-label="Voice">
                <svg class="icon" viewBox="0 0 24 24">
                  <rect x="9" y="3" width="6" height="12" rx="3" />
                  <path d="M5 11a7 7 0 0014 0M12 18v3" />
                </svg>
              </div>
            </div>
            <div class="right">
              <button class="send-btn" id="sendBtn" aria-label="Send" disabled>
                <svg class="icon" viewBox="0 0 24 24">
                  <path d="M5 12h14M13 6l6 6-6 6" />
                </svg>
              </button>
            </div>
          </div>
        </div>
      </section>

      <p class="meta">
        <strong>Suggestion Chip / Default</strong> — slide-up + fade · 300ms ease-out · auto-cycles every 4s · pauses on hover.
      </p>
    </main>

    <script>
      const SUGGESTIONS = [
        "Tell me the key differences between a traditional IRA and a Roth IRA.",
        "What's a donor-advised fund?",
        "How much should I save for retirement?",
        "Explain the wash-sale rule",
        "What's a safe withdrawal rate?",
        "Should I do a Roth conversion?",
      ];

      const CYCLE_MS = 4000;
      const TRANSITION_MS = 300;

      const stack = document.getElementById("chipStack");
      const chip = document.getElementById("suggestionChip");
      const inputText = document.getElementById("inputText");
      const inputWrap = inputText.closest(".chat-input");
      const sendBtn = document.getElementById("sendBtn");

      // Build two layers we swap between so we can crossfade in-place.
      const layerA = document.createElement("span");
      const layerB = document.createElement("span");
      layerA.className = "chip-text is-current";
      layerB.className = "chip-text";
      layerA.textContent = SUGGESTIONS[0];
      layerB.textContent = "";
      stack.appendChild(layerA);
      stack.appendChild(layerB);

      let index = 0;
      let current = layerA;
      let next = layerB;
      let timerId = null;
      let paused = false;

      function rotate() {
        if (paused) return;
        index = (index + 1) % SUGGESTIONS.length;

        // Prep the incoming layer below, invisible.
        next.textContent = SUGGESTIONS[index];
        next.classList.remove("is-current", "is-leaving");
        // Force reflow so the starting state takes effect before we transition in.
        // eslint-disable-next-line no-unused-expressions
        next.offsetHeight;

        // Animate: outgoing slides up + fades out, incoming slides up + fades in.
        current.classList.add("is-leaving");
        next.classList.add("is-current");

        // Swap roles after the transition finishes.
        const justLeft = current;
        current = next;
        next = justLeft;
      }

      function start() {
        stop();
        timerId = window.setInterval(rotate, CYCLE_MS);
      }

      function stop() {
        if (timerId !== null) {
          window.clearInterval(timerId);
          timerId = null;
        }
      }

      // Pressed → sends the current question into the chat input
      chip.addEventListener("click", () => {
        const question = SUGGESTIONS[index];
        inputText.textContent = question;
        inputText.dataset.empty = "false";
        inputWrap.classList.add("is-active");
        sendBtn.disabled = false;
        paused = true;
        stop();
      });

      chip.addEventListener("mouseenter", () => {
        paused = true;
        stop();
      });
      chip.addEventListener("mouseleave", () => {
        paused = false;
        start();
      });
      chip.addEventListener("focus", () => {
        paused = true;
        stop();
      });
      chip.addEventListener("blur", () => {
        paused = false;
        start();
      });

      // Pause when the tab is hidden so we don't drift.
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) stop();
        else if (!paused) start();
      });

      start();
    </script>
  </body>
</html>
